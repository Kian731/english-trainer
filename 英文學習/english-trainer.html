  { type: 'vocab', question: 'His wording was deliberately ____, so both sides could claim victory.', options: ['ambiguous', 'obvious', 'precise', 'literal'], answer: 0, explain: 'ambiguous＝刻意留下多重解讀空間。' },
  { type: 'vocab', question: 'He presented a ____ case for restructuring the department.', options: ['compelling', 'compulsory', 'competent', 'complacent'], answer: 0, explain: 'a compelling case＝極具說服力的論據。' },
  { type: 'vocab', question: 'That is a ____ explanation, though we still need proof.', options: ['plausible', 'plentiful', 'pleasant', 'plain'], answer: 0, explain: 'plausible＝看似合理的。' },
  { type: 'vocab', question: 'Cost is only one ____ used in the selection process.', options: ['criterion', 'criteria', 'crisis', 'critic'], answer: 0, explain: 'criterion 是單數（複數為 criteria）；此處 one 之後用單數。' },
  { type: 'vocab', question: 'The team reached a ____ after only one meeting.', options: ['consensus', 'consequence', 'consignment', 'constitution'], answer: 0, explain: 'reach a consensus＝達成共識。' },
  { type: 'vocab', question: 'Please explain the ____ behind the pricing change.', options: ['rationale', 'ration', 'ratio', 'rating'], answer: 0, explain: 'rationale＝理由、根據。' },
  { type: 'vocab', question: 'The new policy aims to ____ the risk of data loss.', options: ['mitigate', 'magnify', 'motivate', 'mediate'], answer: 0, explain: 'mitigate the risk＝減輕風險。' },
  { type: 'vocab', question: 'Further delays could ____ the entire contract.', options: ['jeopardize', 'justify', 'juggle', 'jettison'], answer: 0, explain: 'jeopardize＝危及。' },
  { type: 'vocab', question: 'The component shortage only ____ the existing delay.', options: ['exacerbated', 'exaggerated', 'excavated', 'exhibited'], answer: 0, explain: 'exacerbate＝使…惡化、加劇。' },
  { type: 'vocab', question: 'Service quality ____ rapidly after the staff cuts.', options: ['deteriorated', 'determined', 'deterred', 'detected'], answer: 0, explain: 'deteriorate＝惡化。' },
  { type: 'vocab', question: 'Her ____ in the face of repeated failure impressed the board.', options: ['reluctance', 'resilience', 'residence', 'resistance'], answer: 1, explain: 'resilience＝面對挫折的復原力。' },
  { type: 'vocab', question: 'The negotiation reached an ____ after three days.', options: ['impasse', 'impact', 'impulse', 'import'], answer: 0, explain: 'reach an impasse＝陷入僵局。' },
  { type: 'vocab', question: 'Given current trends, further price increases seem ____.', options: ['inevitable', 'invaluable', 'invisible', 'inaudible'], answer: 0, explain: 'inevitable＝不可避免的。' },
  { type: 'vocab', question: 'The rumor proved highly ____ to our reputation.', options: ['detrimental', 'developmental', 'departmental', 'documental'], answer: 0, explain: 'be detrimental to＝對…有害。' },
  { type: 'vocab', question: '____ weather conditions delayed the shipment by a week.', options: ['Adverse', 'Averse', 'Adverb', 'Advent'], answer: 0, explain: 'adverse weather＝惡劣天氣。' },
  { type: 'vocab', question: 'Please ____ the issue to senior management immediately.', options: ['escalate', 'evacuate', 'evaluate', 'eliminate'], answer: 0, explain: 'escalate＝向上呈報、使問題升級處理。' },
  { type: 'vocab', question: 'We can ____ the order for an additional handling fee.', options: ['expedite', 'expel', 'expand', 'expire'], answer: 0, explain: 'expedite＝加速處理。' },
  { type: 'vocab', question: 'The equipment purchased in 2009 is now ____.', options: ['obsolete', 'obscure', 'obvious', 'obstinate'], answer: 0, explain: 'obsolete＝過時、已被淘汰的。' },

  /* ══════════ 詞性題 40 ══════════ */
  { type: 'form', question: "The committee's ____ of the data revealed a serious error.", options: ['analyze', 'analyzed', 'analysis', 'analytical'], answer: 2, explain: '所有格 + 空格 + of，空格必須是名詞 → analysis。' },
  { type: 'form', question: 'The auditors questioned the ____ of the estimates.', options: ['accurate', 'accurately', 'accuracy', 'accurateness'], answer: 2, explain: 'the 之後、of 之前需要名詞 → accuracy。' },
  { type: 'form', question: 'Employees are expected to act ____ at all times.', options: ['profession', 'professional', 'professionally', 'professionalism'], answer: 2, explain: '修飾動詞 act 要用副詞 professionally。' },
  { type: 'form', question: 'The merger resulted in a ____ reduction in operating costs.', options: ['significance', 'significant', 'significantly', 'signify'], answer: 1, explain: '冠詞 a 與名詞 reduction 之間用形容詞 significant。' },
  { type: 'form', question: 'The report emphasizes the ____ of regular maintenance.', options: ['important', 'importantly', 'importance', 'imported'], answer: 2, explain: 'the 之後、of 之前需要名詞 → importance。' },
  { type: 'form', question: 'All findings must be documented ____.', options: ['thorough', 'thoroughly', 'thoroughness', 'thoroughgoing'], answer: 1, explain: '修飾動詞片語 be documented 要用副詞 thoroughly。' },
  { type: 'form', question: "The firm's ____ to sustainability has attracted new investors.", options: ['commit', 'committed', 'commitment', 'committing'], answer: 2, explain: '所有格之後需要名詞 → commitment to。' },
  { type: 'form', question: 'The results were ____ consistent with our earlier findings.', options: ['remark', 'remarkable', 'remarkably', 'remarking'], answer: 2, explain: '修飾形容詞 consistent 要用副詞 remarkably。' },
  { type: 'form', question: 'The new protocol has proven highly ____.', options: ['effect', 'effective', 'effectively', 'effectiveness'], answer: 1, explain: 'prove 為連綴動詞，之後接形容詞 effective。' },
  { type: 'form', question: 'The board requested a ____ review of the contract.', options: ['comprehend', 'comprehensive', 'comprehensively', 'comprehension'], answer: 1, explain: '修飾名詞 review 用形容詞 comprehensive。' },
  { type: 'form', question: 'The proposal was rejected on the ____ of insufficient data.', options: ['ground', 'grounds', 'grounded', 'grounding'], answer: 1, explain: 'on the grounds of＝基於…的理由，慣用複數。' },
  { type: 'form', question: 'The team responded to the crisis with remarkable ____.', options: ['efficient', 'efficiently', 'efficiency', 'efficacious'], answer: 2, explain: '形容詞 remarkable 之後需要名詞 → efficiency。' },
  { type: 'form', question: 'Costs have risen ____ since the new tariffs took effect.', options: ['substantial', 'substantially', 'substance', 'substantiate'], answer: 1, explain: '修飾動詞 have risen 要用副詞 substantially。' },
  { type: 'form', question: 'The vendor failed to deliver within the ____ period.', options: ['specify', 'specified', 'specification', 'specifically'], answer: 1, explain: '修飾名詞 period 用過去分詞 specified（指定的）。' },
  { type: 'form', question: 'The audit was conducted with complete ____.', options: ['independent', 'independently', 'independence', 'depend'], answer: 2, explain: '形容詞 complete 之後需要名詞 → independence。' },
  { type: 'form', question: 'The findings are ____ significant for the entire industry.', options: ['potential', 'potentially', 'potent', 'potency'], answer: 1, explain: '修飾形容詞 significant 要用副詞 potentially。' },
  { type: 'form', question: 'The company issued a ____ statement about the recall.', options: ['clarify', 'clarified', 'clarification', 'clarifying'], answer: 3, explain: '修飾名詞 statement 用現在分詞 clarifying（澄清用的）。' },
  { type: 'form', question: 'The ____ of the new system took six months.', options: ['implement', 'implemented', 'implementation', 'implementing'], answer: 2, explain: 'The 之後、of 之前需要名詞 → implementation。' },
  { type: 'form', question: 'Management remains cautiously ____ about the fourth quarter.', options: ['optimism', 'optimist', 'optimistic', 'optimistically'], answer: 2, explain: 'remain 為連綴動詞，之後接形容詞 optimistic。' },
  { type: 'form', question: 'The regulations are enforced ____ across all regions.', options: ['consistent', 'consistently', 'consistency', 'consist'], answer: 1, explain: '修飾動詞片語 are enforced 要用副詞 consistently。' },
  { type: 'form', question: 'A ____ analysis of the market is attached.', options: ['detail', 'detailed', 'detailing', 'details'], answer: 1, explain: '修飾名詞 analysis 用過去分詞 detailed（詳盡的）。' },
  { type: 'form', question: 'The supplier demonstrated a high level of ____.', options: ['reliable', 'reliably', 'reliability', 'rely'], answer: 2, explain: '介系詞 of 之後需要名詞 → reliability。' },
  { type: 'form', question: 'The two proposals differ ____ in scope and cost.', options: ['considerable', 'considerably', 'consideration', 'considering'], answer: 1, explain: '修飾動詞 differ 要用副詞 considerably。' },
  { type: 'form', question: 'The firm has built a reputation for ____ in engineering.', options: ['excellent', 'excellently', 'excellence', 'excel'], answer: 2, explain: '介系詞 for 之後需要名詞 → excellence。' },
  { type: 'form', question: 'The contract contains several ____ ambiguous clauses.', options: ['potential', 'potentially', 'potency', 'potent'], answer: 1, explain: '修飾形容詞 ambiguous 要用副詞 potentially。' },
  { type: 'form', question: 'All decisions must be made in ____ with company policy.', options: ['accord', 'according', 'accordance', 'accordingly'], answer: 2, explain: 'in accordance with＝依照…，是固定名詞片語。' },
  { type: 'form', question: 'The presentation was both concise and ____.', options: ['inform', 'informed', 'informative', 'information'], answer: 2, explain: '與形容詞 concise 並列，也要用形容詞 informative（平行結構）。' },
  { type: 'form', question: 'The board expressed ____ over the delayed filing.', options: ['concern', 'concerned', 'concerning', 'concernedly'], answer: 0, explain: '及物動詞 expressed 之後需要名詞 → concern。' },
  { type: 'form', question: 'The revised forecast is ____ more conservative.', options: ['notice', 'noticed', 'noticeable', 'noticeably'], answer: 3, explain: '修飾比較級 more conservative 要用副詞 noticeably。' },
  { type: 'form', question: 'Access to the archive is strictly ____ to authorized staff.', options: ['limit', 'limited', 'limiting', 'limitation'], answer: 1, explain: 'be limited to＝僅限於，用過去分詞。' },
  { type: 'form', question: 'The proposal lacks the ____ required for board approval.', options: ['specific', 'specifically', 'specificity', 'specify'], answer: 2, explain: 'the 之後需要名詞 → specificity（具體程度）。' },
  { type: 'form', question: 'The transition to the new platform was remarkably ____.', options: ['seam', 'seamed', 'seamless', 'seamlessly'], answer: 2, explain: 'be + 副詞 remarkably 之後接形容詞 seamless。' },
  { type: 'form', question: 'The consultant provided a ____ assessment of the risks.', options: ['candid', 'candidly', 'candidate', 'candor'], answer: 0, explain: '修飾名詞 assessment 用形容詞 candid（坦率的）。' },
  { type: 'form', question: 'The system was designed to operate ____ of human input.', options: ['independent', 'independently', 'independence', 'depend'], answer: 1, explain: 'operate independently of＝獨立於…運作，修飾動詞用副詞。' },
  { type: 'form', question: 'The report highlights the ____ of the current approach.', options: ['limit', 'limited', 'limitations', 'limiting'], answer: 2, explain: 'the 之後、of 之前需要名詞 → limitations（侷限）。' },
  { type: 'form', question: 'Costs were reduced without any ____ loss of quality.', options: ['notice', 'noticed', 'noticeable', 'noticeably'], answer: 2, explain: '修飾名詞 loss 用形容詞 noticeable。' },
  { type: 'form', question: 'The firm operates with a high degree of ____.', options: ['transparent', 'transparently', 'transparency', 'transpire'], answer: 2, explain: '介系詞 of 之後需要名詞 → transparency。' },
  { type: 'form', question: 'The revised terms are ____ favorable to the buyer.', options: ['increase', 'increased', 'increasing', 'increasingly'], answer: 3, explain: '修飾形容詞 favorable 要用副詞 increasingly。' },
  { type: 'form', question: 'Every stage of the process is ____ documented.', options: ['meticulous', 'meticulously', 'meticulousness', 'meticulosity'], answer: 1, explain: '修飾過去分詞 documented 要用副詞 meticulously。' },
  { type: 'form', question: 'The delay had serious ____ for the entire supply chain.', options: ['imply', 'implied', 'implications', 'implicating'], answer: 2, explain: '形容詞 serious 之後需要名詞 → implications（影響）。' },

  /* ══════════ 文法題 88 ══════════ */
  { type: 'grammar', question: 'Not only ____ the deadline, but the team also exceeded the target.', options: ['they met', 'did they meet', 'met they', 'they did meet'], answer: 1, explain: 'Not only 置句首要倒裝：did + 主詞 + 原形動詞。' },
  { type: 'grammar', question: 'Rarely ____ such a rapid recovery in this industry.', options: ['we have seen', 'have we seen', 'we had seen', 'seen we have'], answer: 1, explain: '否定副詞 Rarely 置句首須倒裝：have + 主詞 + p.p.。' },
  { type: 'grammar', question: 'Seldom ____ a proposal so thoroughly researched.', options: ['the board receives', 'does the board receive', 'the board does receive', 'receives the board'], answer: 1, explain: 'Seldom 置句首倒裝：does + 主詞 + 原形動詞。' },
  { type: 'grammar', question: 'Little ____ that the supplier would default.', options: ['we knew', 'did we know', 'we did know', 'knew we'], answer: 1, explain: 'Little 表否定，置句首須倒裝。' },
  { type: 'grammar', question: 'Not until the audit ended ____ the truth.', options: ['we learned', 'did we learn', 'we did learn', 'learned we'], answer: 1, explain: 'Not until 置句首，主要子句倒裝。' },
  { type: 'grammar', question: 'Only after the results were published ____ the flaw.', options: ['they noticed', 'did they notice', 'they did notice', 'noticed they'], answer: 1, explain: 'Only after 置句首，主要子句倒裝。' },
  { type: 'grammar', question: 'Only when all data has been verified ____ the report be released.', options: ['will', 'is', 'has', 'does'], answer: 0, explain: 'Only when 置句首，主要子句倒裝：will + 主詞 + 原形動詞。' },
  { type: 'grammar', question: '____ is the revised contract for your review.', options: ['Attach', 'Attached', 'Attaching', 'Attaches'], answer: 1, explain: 'Attached is / Enclosed is 是正式書信的倒裝句型。' },
  { type: 'grammar', question: 'So rapid ____ that we had to hire immediately.', options: ['the growth was', 'was the growth', 'the growth had', 'had the growth'], answer: 1, explain: 'So + 形容詞置句首要倒裝：was + 主詞。' },
  { type: 'grammar', question: '____ the report been submitted earlier, the issue would have been resolved.', options: ['If', 'Had', 'Have', 'Would'], answer: 1, explain: '與過去事實相反且省略 if 的倒裝：Had + 主詞 + p.p.。' },
  { type: 'grammar', question: 'If the supplier had notified us, we ____ the delay.', options: ['avoid', 'would avoid', 'would have avoided', 'had avoided'], answer: 2, explain: '與過去事實相反：主句用 would have + p.p.。' },
  { type: 'grammar', question: '____ you require further assistance, please let us know.', options: ['Should', 'Would', 'Could', 'Might'], answer: 0, explain: 'Should + 主詞 + 原形＝萬一…，是 if 省略後的倒裝。' },
  { type: 'grammar', question: '____ the terms more favorable, we would sign today.', options: ['Was', 'Were', 'Had', 'Have'], answer: 1, explain: '與現在事實相反省略 if 的倒裝：Were + 主詞。' },
  { type: 'grammar', question: 'If the merger ____ to fail, we would need an entirely new strategy.', options: ['is', 'was', 'were', 'will be'], answer: 2, explain: 'were to + V 表示可能性極低的未來假設。' },
  { type: 'grammar', question: 'If he had accepted the offer, he ____ in London now.', options: ['is', 'would be', 'would have been', 'will be'], answer: 1, explain: '混合條件句：過去的條件、現在的結果（now），主句用 would + 原形。' },
  { type: 'grammar', question: 'If we had invested earlier, we ____ the patent today.', options: ['own', 'would own', 'would have owned', 'owned'], answer: 1, explain: '結果在現在（today），用 would + 原形動詞。' },
  { type: 'grammar', question: 'The auditor recommended that the procedure ____ revised.', options: ['is', 'was', 'be', 'will be'], answer: 2, explain: 'recommend 後的 that 子句用原形動詞（should 省略）。' },
  { type: 'grammar', question: 'The regulations require that every employee ____ a security badge.', options: ['wears', 'wear', 'wearing', 'wore'], answer: 1, explain: 'require 後的 that 子句用原形動詞，不隨主詞加 -s。' },
  { type: 'grammar', question: 'The board insisted that the CEO ____ immediately.', options: ['resigns', 'resigned', 'resign', 'resigning'], answer: 2, explain: 'insist 後的 that 子句用原形動詞 resign。' },
  { type: 'grammar', question: 'It is essential that the deadline ____ met.', options: ['is', 'was', 'be', 'will be'], answer: 2, explain: 'It is essential that + 主詞 + 原形動詞。' },
  { type: 'grammar', question: 'It is imperative that all staff ____ the briefing.', options: ['attends', 'attend', 'attending', 'attended'], answer: 1, explain: 'It is imperative that 之後用原形動詞。' },
  { type: 'grammar', question: 'I wish I ____ about the risk earlier.', options: ['know', 'knew', 'had known', 'have known'], answer: 2, explain: '對「過去」的遺憾，wish 之後用 had + p.p.。' },
  { type: 'grammar', question: 'The client wishes the delivery ____ faster.', options: ['is', 'was', 'were', 'has been'], answer: 2, explain: 'wish + 過去式表與現在事實相反，be 動詞用 were。' },
  { type: 'grammar', question: '____ in 2010, the facility has been upgraded twice.', options: ['Opening', 'Opened', 'To open', 'Open'], answer: 1, explain: '設施「被」啟用，分詞構句用過去分詞。' },
  { type: 'grammar', question: '____ completed the audit, the team submitted its findings.', options: ['Have', 'Having', 'Had', 'Has'], answer: 1, explain: '動作有先後且主詞相同，用 Having + p.p.。' },
  { type: 'grammar', question: '____ in plain English, the manual is easy to follow.', options: ['Writing', 'Written', 'Write', 'To write'], answer: 1, explain: '手冊「被」書寫，用過去分詞的分詞構句。' },
  { type: 'grammar', question: 'Weather ____, the ceremony will be held outdoors.', options: ['permit', 'permits', 'permitting', 'permitted'], answer: 2, explain: '獨立分詞構句：分詞主詞 Weather 與主句不同，主動用 V-ing。' },
  { type: 'grammar', question: 'All things ____, the outcome was acceptable.', options: ['consider', 'considering', 'considered', 'considers'], answer: 2, explain: 'All things considered＝整體考量下來，是固定的獨立分詞構句。' },
  { type: 'grammar', question: '____ the committee found most concerning was the lack of documentation.', options: ['That', 'What', 'Which', 'It'], answer: 1, explain: 'found 之後缺受詞，用兼具代名詞功能的 What。' },
  { type: 'grammar', question: 'The director confirmed ____ the project would proceed as planned.', options: ['what', 'that', 'which', 'whose'], answer: 1, explain: '後面是完整子句，用 that 引導名詞子句。' },
  { type: 'grammar', question: '____ the plan succeeds depends largely on funding.', options: ['If', 'Whether', 'That if', 'Unless'], answer: 1, explain: '名詞子句當主詞只能用 Whether，不可用 If。' },
  { type: 'grammar', question: 'We are still unsure ____ or not to proceed.', options: ['if', 'whether', 'that', 'what'], answer: 1, explain: '只有 whether 能直接接 or not。' },
  { type: 'grammar', question: 'He missed the deadline, ____ surprised everyone.', options: ['that', 'which', 'what', 'it'], answer: 1, explain: '逗號後的 which 指代前面整件事；非限定用法不可用 that。' },
  { type: 'grammar', question: 'All contractors, ____ credentials have been verified, may enter.', options: ['who', 'whom', 'whose', 'which'], answer: 2, explain: '空格後直接接名詞 credentials，表所有關係，用 whose。' },
  { type: 'grammar', question: 'The room ____ which the meeting was held has been renovated.', options: ['in', 'on', 'at', 'by'], answer: 0, explain: 'hold a meeting in a room → 介系詞提前為 in which。' },
  { type: 'grammar', question: 'The client ____ whom we prepared the report was satisfied.', options: ['to', 'for', 'by', 'with'], answer: 1, explain: 'prepare something for someone → for whom。' },
  { type: 'grammar', question: 'We received 50 applications, most of ____ were incomplete.', options: ['them', 'which', 'that', 'those'], answer: 1, explain: '「數量詞 + of + which」用來連接前一句的名詞形成關係子句。' },
  { type: 'grammar', question: 'The firm employs 200 people, 30 of ____ work remotely.', options: ['them', 'who', 'whom', 'which'], answer: 2, explain: '介系詞 of 之後接受格關代 whom（先行詞是人）。' },
  { type: 'grammar', question: '____ submits the proposal must also sign it.', options: ['Whoever', 'Whomever', 'Whichever', 'However'], answer: 0, explain: 'Whoever＝anyone who，在子句中當主詞。' },
  { type: 'grammar', question: 'We will accept ____ option is more cost-effective.', options: ['whoever', 'whatever', 'whichever', 'however'], answer: 2, explain: '在有限選項中挑選用 whichever + 名詞。' },
  { type: 'grammar', question: '____ difficult the task is, we must finish it on time.', options: ['However', 'Whatever', 'Whichever', 'Whenever'], answer: 0, explain: 'However + 形容詞 + 主詞 + 動詞＝無論多麼…。' },
  { type: 'grammar', question: 'It was the deadline ____ forced us to compromise.', options: ['what', 'that', 'when', 'where'], answer: 1, explain: '強調句型 It is / was + 強調部分 + that。' },
  { type: 'grammar', question: 'It was in 2020 ____ the policy finally took effect.', options: ['when', 'that', 'which', 'what'], answer: 1, explain: '強調時間片語時仍用 that，不是 when。' },
  { type: 'grammar', question: 'Neither of the vendors ____ met the delivery requirements.', options: ['have', 'has', 'are', 'were'], answer: 1, explain: 'neither of + 複數名詞視為單數。' },
  { type: 'grammar', question: 'The number of complaints ____ declined sharply this quarter.', options: ['have', 'has', 'were', 'are'], answer: 1, explain: 'the number of…（…的數量）視為單數。' },
  { type: 'grammar', question: 'A number of employees ____ requested flexible hours.', options: ['has', 'have', 'is', 'was'], answer: 1, explain: 'a number of + 複數名詞＝許多，動詞用複數。' },
  { type: 'grammar', question: 'Neither the manager nor the assistants ____ informed.', options: ['was', 'were', 'has', 'is'], answer: 1, explain: 'neither A nor B 依「就近原則」，動詞與 assistants 一致。' },
  { type: 'grammar', question: 'Not only the staff but also the director ____ surprised.', options: ['were', 'was', 'have', 'are'], answer: 1, explain: '就近原則：動詞與最近的主詞 the director 一致。' },
  { type: 'grammar', question: 'The report, along with the supporting documents, ____ submitted.', options: ['were', 'was', 'have', 'are'], answer: 1, explain: 'along with 片語不影響主詞單複數，主詞是 The report。' },
  { type: 'grammar', question: 'The manager, as well as her assistants, ____ attending the summit.', options: ['are', 'is', 'were', 'have'], answer: 1, explain: 'as well as 片語不改變主詞，動詞配合 The manager。' },
  { type: 'grammar', question: 'The position requires managing budgets, supervising staff, and ____ reports.', options: ['prepare', 'to prepare', 'preparing', 'prepared'], answer: 2, explain: '平行結構：前兩項是 V-ing，第三項也必須是 preparing。' },
  { type: 'grammar', question: 'She is known not only for her research ____ for her teaching.', options: ['and also', 'but also', 'as well', 'or also'], answer: 1, explain: 'not only A but also B 是固定平行結構。' },
  { type: 'grammar', question: 'Our margins are higher than ____ of our competitors.', options: ['that', 'those', 'them', 'it'], answer: 1, explain: '比較對象是複數 margins，用 those 代替以避免錯誤比較。' },
  { type: 'grammar', question: "The city's population is larger than ____ of the capital.", options: ['those', 'that', 'them', 'it'], answer: 1, explain: '比較對象是單數 population，用 that 代替。' },
  { type: 'grammar', question: 'The proposal was well researched; ____, the committee rejected it.', options: ['therefore', 'nevertheless', 'moreover', 'thus'], answer: 1, explain: '語意轉折（研究充分卻被否決），用 nevertheless。' },

For decades, warranty claims sat in a corner of the finance function, treated as an unavoidable cost of doing business. Manufacturers reserved against them, disputed the larger ones, and moved on.

    id: 'a7-9', kind: 'single',
    docs: [{ label: 'Article', text: `The Limits of Benchmarking

Benchmarking has an obvious appeal. If a competitor converts inventory eleven times a year and you convert it seven, the gap looks like an opportunity. Consultants have built durable practices on precisely this observation.

The difficulty is that ratios are outputs of business models, not independent levers. A firm turning inventory eleven times may be doing so because it serves a narrow product range to a concentrated customer base — a position that also caps its growth. Copying the ratio without adopting the model produces stockouts, not efficiency.

There is a subtler problem. Published benchmarks are drawn from firms willing to participate, which skews samples toward the organized and the successful. Median performance in a benchmark study is rarely median performance in the industry.

None of this makes benchmarking useless. It is a diagnostic that generates questions worth asking. The error lies in treating it as an answer, and specifically in setting targets equal to another firm's ratio without establishing whether that ratio is achievable within your own constraints.` }],

Our current approach assesses vendors at onboarding and every three years thereafter. I recommend replacing this with continuous monitoring for the tier of vendors with access to production systems.

The case is straightforward. Of the four security incidents affecting us in the last two years, three originated with vendors that had passed assessment within the preceding eighteen months. Point-in-time assessment tells us that controls existed on the day of review; it tells us nothing about the day of compromise.

    id: 'a7-16', kind: 'single',
    docs: [{ label: 'Article', text: `When Cost Savings Do Not Appear

Finance functions routinely approve business cases promising savings that never materialise in the accounts. The usual explanation — that the savings were overstated — is often wrong.

Consider a project that reduces the labour hours required for a process by 20%. The saving is real in the sense that the hours are genuinely no longer needed. But unless headcount is actually reduced, or the freed capacity absorbs work that would otherwise have required hiring, the cost line does not move. The saving exists as capacity, not as cash.

This distinction is frequently lost between the business case and the budget. Business cases are written in the language of efficiency; budgets are written in the language of expenditure. A project can be entirely successful on its own terms and invisible in the accounts.

The remedy is procedural rather than analytical. Where a case claims a headcount saving, the corresponding budget line should be reduced at approval, not at delivery. This forces the conversation about whether the reduction is genuinely intended while the project can still be reconsidered — and prevents the familiar outcome in which a saving is claimed twice, once in the business case and once when the post is eventually cut for unrelated reasons.` }],

    id: 'a7-20', kind: 'single',
    docs: [{ label: 'Article', text: `The Quiet Cost of Approval Layers

Organisations add approval steps for understandable reasons. A loss occurs, an inquiry follows, and a control is introduced. Each addition is individually defensible.

What is rarely measured is the aggregate. One manufacturer found that a routine capital request passed through eleven approval points, of which four had been added following incidents that the added control would not, on examination, have prevented. The median elapsed time was 47 days, of which 39 were spent waiting rather than being reviewed.

The waiting is the significant figure. Approval layers impose two costs: the reviewer's time, which is visible and usually small, and the delay, which is invisible and often large. A capital project delayed 39 days does not merely start later; in seasonal industries it may miss an installation window entirely and slip a full year.

Removing layers is harder than adding them, because the person proposing removal must argue against a control introduced in response to a real loss. The manufacturer's approach was instructive: rather than debating each layer, it required every approval point to demonstrate, from the last two years of records, at least one instance in which it had changed an outcome. Four could not.` }],

Ahead of the Annual General Meeting, I want to address the resolution on executive remuneration directly.

The Remuneration Committee is recommending a change to the long-term incentive plan, replacing the current three-year total shareholder return metric with a combination of return on capital employed and a carbon intensity measure.

I anticipate two objections. The first is that carbon intensity is not a financial measure and does not belong in a pay plan. The Committee's view is that our licence to operate in three of our largest markets is increasingly contingent on demonstrable progress, and that a measure the Board considers material to long-term value should be capable of being incentivised.

The second objection is that return on capital employed is more easily managed than total shareholder return. This is true, and it is why we have set the threshold against an external cost-of-capital benchmark rather than an internally determined budget, and why the Committee retains discretion to reduce awards where outcomes do not reflect underlying performance.

I would rather set out these arguments now than encounter them for the first time in the meeting.

Yours faithfully,

The Harlow site satisfies the primary technical criteria. Grid capacity is adequate, road access is suitable for abnormal loads, and the ground conditions require no unusual foundation work.

Second, the vendor's title includes a restrictive covenant, granted in 1974, limiting use to "light industrial purposes." Counsel's preliminary view is that the proposed use is arguably within that definition, but the covenant benefits an adjoining landowner whose consent has not been sought. Indemnity insurance is available but would not cover the risk of injunctive relief.

Section 5: Findings

The automation program has delivered throughput gains of 22% against a business case assumption of 30%. The shortfall is not attributable to the technology, which performs within specification.

Three factors account for the gap. First, order profiles have shifted toward smaller, more frequent shipments, which reduces the efficiency advantage of batch picking. Second, two of the six induction stations have been operated below capacity because of a persistent shortage of trained operators. Third, the legacy warehouse management system was retained, and its scheduling logic was not designed for the new equipment.

We note that the third factor was identified as a risk during planning and accepted on the basis that a system replacement would extend the program by nine months.

Our view is that the throughput target remains achievable, but not without addressing the scheduling constraint. Staffing and order-profile effects together account for an estimated 3 percentage points; the remaining 5 points are systemic.` },
      { label: 'E-mail', text: `To: Operations Steering Group
From: R. Bhattacharya, Program Director
Date: 12 September
Subject: Response to the independent review

Colleagues,

I accept the findings and want to address the point I expect will attract most discussion.

The decision to retain the legacy system was mine. Given the commercial commitments in place at the time, a nine-month extension was not available to us, and I would make the same decision again on the same information.

That said, the review is right that the constraint is now the binding one. I propose we bring forward the system replacement to next fiscal year rather than the year after. On the reviewers' own numbers, closing the systemic gap recovers more than the staffing and order-profile issues combined.

I would ask the group to note that the operator shortage is a labor-market issue that we have not solved by raising pay, and I do not recommend further increases as the primary lever.

Ravi` }

The programme has contacted 84,000 of the 91,000 affected customers and paid redress totalling £47m.

Three findings warrant attention.

Finding 1: The 7,000 uncontacted customers are not randomly distributed. They are disproportionately customers whose accounts closed before 2018, for whom the firm holds only historic address data. Standard tracing has been attempted once.

Finding 2: Redress calculations applied an 8% simple interest uplift. The methodology paper specifies 8% compound. Testing of 200 files found the error in 187, understating redress by an average of £310 per file.

Finding 3: Complaint handling within the programme has a 41% overturn rate at the Ombudsman, against a firm-wide average of 19%. The programme's own quality assurance passed 96% of the sampled cases that were subsequently overturned.

We regard Finding 2 as the most urgent, as it affects customers already treated as resolved.` },
      { label: 'E-mail', text: `To: Board Risk Committee
From: Director of Conduct
Date: 3 March
Subject: Remediation review — my assessment

Members,

I agree with the review's findings but not with its prioritisation.

Finding 2 is serious but bounded and mechanical. We know the population, we know the error, and correction is a calculation exercise. I have instructed that all files be recalculated and additional payments made within eight weeks.

Finding 3 concerns me more. A 41% overturn rate against a 19% baseline suggests our decisions are wrong at more than twice the normal rate, and our quality assurance did not detect it. That is not a calculation error; it is a judgement failure that our own controls are blind to. Until we understand why QA passed those cases, we cannot rely on any assurance the programme has given us — including its assurance about Finding 1.

I propose an independent review of the QA function before we accept any further programme reporting.

Director of Conduct` }

<script>
/* ============================================================
   等級設定與資料組裝（多益 TOEIC 導向）
   ------------------------------------------------------------
   實際內容分散在 data/ 資料夾，方便個別維護：
     單字   *-words.js      語法   *-grammar.js
     Part 5 *-quiz.js       Part 6 *-part6.js      Part 7 *-part7.js
   ------------------------------------------------------------
   words   : { en, pos, zh, phonetic, example, exampleZh }
   grammar : { title, point, examples: [{ en, zh }] }
   quiz    : { part, type, question, options, answer(索引), explain, passage? }
             part 5 → type = 'vocab'(詞彙) | 'form'(詞性) | 'grammar'(文法)
             part 6 → 段落填空，passage 為短文物件
             part 7 → 閱讀理解，passage 為文章組物件
   ============================================================ */

/* Part 6：把每篇短文的 4 個空格攤平成 4 道獨立題目 */
function buildPart6(passages) {
  const items = [];
  passages.forEach((p) => {
    p.blanks.forEach((b, i) => {
      items.push({
        part: 6,
        type: 'part6',
        question: `空格 (${i + 1}) 應填入下列何者？`,
        options: b.options,
        answer: b.answer,
        explain: b.explain,
        passage: p,
        blankNo: i + 1
      });
    });
  });
  return items;
}

/* Part 7：把每組文章的理解題攤平成獨立題目 */
function buildPart7(sets) {
  const items = [];
  sets.forEach((s) => {
    s.questions.forEach((q) => {
      items.push({
        part: 7,
        type: 'part7',
        question: q.q,
        options: q.options,
        answer: q.answer,
        explain: q.explain,
        passage: s
      });
    });
  });
  return items;
}

/* Part 5 的題目本來就是單句題，只補上 part 標記 */
function buildPart5(list) {
  return list.map((q) => Object.assign({ part: 5 }, q));
}

function buildQuiz(part5, part6, part7) {
  // 順序固定為 5 → 6 → 7，這樣已儲存的答對紀錄索引才不會跑掉
  return buildPart5(part5).concat(buildPart6(part6), buildPart7(part7));
}

const DATA = {
  basic: {
    key: 'basic',
    name: '基礎',
    subtitle: 'TOEIC 350-500',
    desc: '辦公室日常字彙、基本時態與詞性判斷，打好 Part 5 的基本盤。',
    words: BASIC_WORDS,
    grammar: BASIC_GRAMMAR,
    quiz: buildQuiz(BASIC_QUIZ, BASIC_PART6, BASIC_PART7)
  },
  intermediate: {
    key: 'intermediate',
    name: '進階',
    subtitle: 'TOEIC 550-700',
    desc: '商務字彙、被動語態、連接詞與介系詞辨析，多益 Part 5 的主要得分區。',
    words: INTER_WORDS,
    grammar: INTER_GRAMMAR,
    quiz: buildQuiz(INTER_QUIZ, INTER_PART6, INTER_PART7)
  },
  advanced: {
    key: 'advanced',
    name: '高級',
    subtitle: 'TOEIC 750-900',
    desc: '正式商務用語、倒裝、假設語氣與平行結構，衝刺 Part 5 難題與 Part 6 銜接。',
    words: ADV_WORDS,
    grammar: ADV_GRAMMAR,
    quiz: buildQuiz(ADV_QUIZ, ADV_PART6, ADV_PART7)
  }
};

const LEVEL_ORDER = ['basic', 'intermediate', 'advanced'];

/* 測驗可選的 Part 分類 */
const PART_INFO = {
  5: { name: 'Part 5', zh: '單句填空', desc: '一句挖一個空，考詞彙、詞性與文法' },
  6: { name: 'Part 6', zh: '段落填空', desc: '商務短文挖四個空，含整句插入題' },
  7: { name: 'Part 7', zh: '閱讀理解', desc: '文章理解，含雙篇與三篇對照題' }
};
const PART_ORDER = [5, 6, 7];

</script>
<script>
/* 英文學習 English Trainer — 主程式 */

const $ = (id) => document.getElementById(id);

const PROFILE_KEY = 'englishTrainerProfiles.v1';
const LEGACY_KEY = 'englishTrainerProgress.v1';   // 舊版單一進度，會自動搬到第一組
const PROFILE_COUNT = 3;

const state = {
  level: null,       // 目前等級 key
  wordIndex: 0,      // 目前單字卡索引
  quiz: null,        // 進行中的測驗
  roundSize: 10,     // 每回合題數（0 = 全部）
  parts: [5, 6, 7]   // 要出題的 Part
};

/* ---------------- 學習者記錄（3 組） ---------------- */
function blankProfile(i) {
  return { name: `學習者 ${i + 1}`, data: {} };
}

function loadProfiles() {
  let p = null;
  try { p = JSON.parse(localStorage.getItem(PROFILE_KEY)); } catch (e) { p = null; }

  if (!p || !Array.isArray(p.slots)) {
    p = { active: 0, slots: [] };
    for (let i = 0; i < PROFILE_COUNT; i++) p.slots.push(blankProfile(i));
    // 舊版只有一份進度，開檔時自動搬進第一組，不讓使用者的紀錄消失
    try {
      const legacy = JSON.parse(localStorage.getItem(LEGACY_KEY));
      if (legacy) p.slots[0].data = legacy;
    } catch (e) { /* 沒有舊資料就略過 */ }
  }
  while (p.slots.length < PROFILE_COUNT) p.slots.push(blankProfile(p.slots.length));
  if (!(p.active >= 0 && p.active < PROFILE_COUNT)) p.active = 0;
  return p;
}

function saveProfiles(p) {
  localStorage.setItem(PROFILE_KEY, JSON.stringify(p));
}

/* ---------------- 進度儲存（讀寫目前這一組） ---------------- */
function loadProgress() {
  const p = loadProfiles();
  return p.slots[p.active].data || {};
}
function saveProgress(data) {
  const p = loadProfiles();
  p.slots[p.active].data = data;
  saveProfiles(p);
}
function levelProgress(key) {
  const p = loadProgress();
  const lv = Object.assign(
    { learned: [], grammarRead: [], correct: [], best: null },
    p[key]
  );
  // 舊版把 best 存成單一數字，統一轉成 { score, total }
  if (typeof lv.best === 'number') lv.best = { score: lv.best, total: 10 };
  return lv;
}
function updateLevelProgress(key, patch) {
  const p = loadProgress();
  p[key] = Object.assign(levelProgress(key), patch);
  saveProgress(p);
}
// 成績以「答對率」比較，這樣 10 題與 50 題的紀錄才有可比性
function bestText(best) {
  if (!best) return '—';
  return `${best.score}/${best.total}（${Math.round((best.score / best.total) * 100)}%）`;
}

/* ---------------- 等級選擇頁 ---------------- */

// 空心圓餅圖：半徑 15.9155 時圓周恰為 100，stroke-dasharray 可直接吃百分比
function donut(label, done, total, colorVar) {
  const pct = total ? Math.round((done / total) * 100) : 0;
  return `
    <div class="donut-item">
      <svg class="donut" viewBox="0 0 36 36" role="img" aria-label="${label} ${pct}%">
        <circle class="donut-track" cx="18" cy="18" r="15.9155"></circle>
        ${pct === 0 ? '' /* 0% 時不畫，否則圓形端點會留下一個小點 */ : `
        <circle class="donut-fill" cx="18" cy="18" r="15.9155"
                stroke="var(${colorVar})" stroke-dasharray="${pct} ${100 - pct}"></circle>`}
        <text class="donut-pct" x="18" y="18.5">${pct}%</text>
      </svg>
      <div class="donut-label">${label}</div>
      <div class="donut-count">${done}/${total}</div>
    </div>`;
}

/* ---------------- 學習者記錄卡 ---------------- */
function profileStats(data) {
  let done = 0, total = 0;
  LEVEL_ORDER.forEach((k) => {
    const lv = DATA[k];
    const d = Object.assign({ learned: [], grammarRead: [], correct: [] }, data[k]);
    done += d.learned.length + d.grammarRead.length + d.correct.length;
    total += lv.words.length + lv.grammar.length + lv.quiz.length;
  });
  return { done, total, pct: total ? Math.round((done / total) * 100) : 0 };
}

function renderProfiles() {
  const p = loadProfiles();
  $('activeName').textContent = p.slots[p.active].name;

  const wrap = $('profileCards');
  wrap.innerHTML = '';
  p.slots.forEach((slot, i) => {
    const s = profileStats(slot.data || {});
    const active = i === p.active;
    const card = document.createElement('div');
    card.className = 'profile-card' + (active ? ' active' : '');
    card.innerHTML = `
      <div class="profile-top">
        <input class="profile-name" type="text" maxlength="12" value="${esc(slot.name)}" aria-label="學習者名稱">
        ${active ? '<span class="using-tag">使用中</span>' : ''}
      </div>
      <div class="profile-bar"><div class="profile-bar-fill" style="width:${s.pct}%"></div></div>
      <div class="profile-stat">整體進度 <b>${s.pct}%</b>　<span class="profile-sub">${s.done} / ${s.total} 項</span></div>
      <div class="profile-actions">
        <button class="mini-btn load-btn" ${active ? 'disabled' : ''}>${active ? '目前使用中' : '讀取進度'}</button>
        <button class="mini-btn danger clear-btn">清除記錄</button>
      </div>`;

    const nameInput = card.querySelector('.profile-name');
    const commitName = () => {
      const all = loadProfiles();
      const v = nameInput.value.trim();
      all.slots[i].name = v || `學習者 ${i + 1}`;
      saveProfiles(all);
      renderProfiles();
    };
    nameInput.onchange = commitName;
    nameInput.onkeydown = (e) => { if (e.key === 'Enter') nameInput.blur(); };

    card.querySelector('.load-btn').onclick = () => {
      const all = loadProfiles();
      all.active = i;
      saveProfiles(all);
      renderProfiles();
      renderHome();
    };

    card.querySelector('.clear-btn').onclick = () => {
      const all = loadProfiles();
      const name = all.slots[i].name;
      if (!confirm(`確定要清除「${name}」的所有進度嗎？\n單字、語法與測驗紀錄都會歸零，此動作無法復原。`)) return;
      all.slots[i].data = {};
      saveProfiles(all);
      renderProfiles();
      renderHome();
    };

    wrap.appendChild(card);
  });
}

function renderHome() {
  const wrap = $('levelCards');
  wrap.innerHTML = '';
  LEVEL_ORDER.forEach((key) => {
    const lv = DATA[key];
    const prog = levelProgress(key);
    const card = document.createElement('button');
    card.className = `level-card lv-${key}`;
    card.innerHTML = `
      <span class="lv-badge">${lv.subtitle}</span>
      <h3>${lv.name}</h3>
      <p>${lv.desc}</p>
      <div class="donuts">
        ${donut('單字', prog.learned.length, lv.words.length, '--accent')}
        ${donut('語法', prog.grammarRead.length, lv.grammar.length, '--accent-2')}
        ${donut('題目', prog.correct.length, lv.quiz.length, '--ok')}
      </div>
      <div class="lv-stats">
        <span>最佳成績 <b>${bestText(prog.best)}</b></span>
      </div>`;
    card.onclick = () => openLevel(key);
    wrap.appendChild(card);
  });
}

function openLevel(key) {
  state.level = key;
  state.wordIndex = 0;
  const lv = DATA[key];
  $('levelTitle').textContent = `${lv.name}　${lv.subtitle}`;
  $('levelDesc').textContent = lv.desc;
  $('viewHome').classList.add('hidden');
  $('viewLevel').classList.remove('hidden');
  $('btnHome').style.visibility = 'visible';
  switchTab('words');
  renderWord();
  renderWordList();
  renderGrammar();
  resetQuizView();
}

function goHome() {
  state.level = null;
  $('viewLevel').classList.add('hidden');
  $('viewHome').classList.remove('hidden');
  $('btnHome').style.visibility = 'hidden';
  renderProfiles();
  renderHome();
}

/* ---------------- 分頁切換 ---------------- */
function switchTab(name) {
  document.querySelectorAll('.tab').forEach((t) =>
    t.classList.toggle('active', t.dataset.tab === name)
  );
  ['words', 'grammar', 'quiz'].forEach((n) => {
    $('tab' + n[0].toUpperCase() + n.slice(1)).classList.toggle('hidden', n !== name);
  });
}

/* ---------------- 單字卡 ---------------- */
function currentWords() {
  return DATA[state.level].words;
}

function renderWord() {
  const words = currentWords();
  const w = words[state.wordIndex];
  const prog = levelProgress(state.level);

  $('flashcard').classList.remove('flipped');
  $('fcWord').textContent = w.en;
  $('fcPhonetic').textContent = w.phonetic;
  $('fcPos').textContent = w.pos;
  $('fcZh').textContent = w.zh;
  $('fcExample').textContent = w.example;
  $('fcExampleZh').textContent = w.exampleZh;

  $('wordCounter').textContent = `${state.wordIndex + 1} / ${words.length}`;
  $('learnedCounter').textContent = `已學會 ${prog.learned.length} / ${words.length}`;

  const isLearned = prog.learned.includes(w.en);
  $('markLearned').textContent = isLearned ? '✓ 已學會（點擊取消）' : '標記為已學會';

  document.querySelectorAll('#wordList li').forEach((li, i) => {
    li.classList.toggle('current', i === state.wordIndex);
    li.classList.toggle('learned', prog.learned.includes(words[i].en));
  });
}

function renderWordList() {
  const list = $('wordList');
  list.innerHTML = '';
  currentWords().forEach((w, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span>${w.en}</span>`;
    li.onclick = () => { state.wordIndex = i; renderWord(); };
    list.appendChild(li);
  });
}

function moveWord(step) {
  const n = currentWords().length;
  state.wordIndex = (state.wordIndex + step + n) % n;
  renderWord();
}

function toggleLearned() {
  const w = currentWords()[state.wordIndex];
  const prog = levelProgress(state.level);
  const i = prog.learned.indexOf(w.en);
  if (i === -1) prog.learned.push(w.en);
  else prog.learned.splice(i, 1);
  updateLevelProgress(state.level, { learned: prog.learned });
  renderWord();
}

/* ---------------- 語法 ---------------- */
function renderGrammar() {
  const lv = DATA[state.level];
  const prog = levelProgress(state.level);
  $('grammarCounter').textContent = `已讀 ${prog.grammarRead.length} / ${lv.grammar.length}`;

  const wrap = $('grammarList');
  wrap.innerHTML = '';
  lv.grammar.forEach((g, i) => {
    const isRead = prog.grammarRead.includes(g.title);
    const item = document.createElement('div');
    item.className = 'grammar-item' + (i === 0 ? ' open' : '') + (isRead ? ' read' : '');
    const exHtml = g.examples
      .map((e) => `<div class="g-ex"><div class="en">${e.en}</div><div class="zh">${e.zh}</div></div>`)
      .join('');
    item.innerHTML = `
      <button class="grammar-head"><span class="g-title">${i + 1}. ${g.title}</span><span class="arrow">▸</span></button>
      <div class="grammar-body" ${i === 0 ? '' : 'style="display:none"'}>
        <p class="point">${g.point}</p>${exHtml}
        <button class="read-btn">${isRead ? '✓ 已讀（點擊取消）' : '標記為已讀'}</button>
      </div>`;
    const body = item.querySelector('.grammar-body');
    item.querySelector('.grammar-head').onclick = () => {
      const open = item.classList.toggle('open');
      body.style.display = open ? '' : 'none';
    };
    item.querySelector('.read-btn').onclick = () => toggleGrammarRead(g.title);
    wrap.appendChild(item);
  });
}

function toggleGrammarRead(title) {
  const prog = levelProgress(state.level);
  const i = prog.grammarRead.indexOf(title);
  if (i === -1) prog.grammarRead.push(title);
  else prog.grammarRead.splice(i, 1);
  updateLevelProgress(state.level, { grammarRead: prog.grammarRead });
  renderGrammar();
}

/* ---------------- 測驗 ---------------- */
const TYPE_LABEL = {
  vocab: '詞彙題', form: '詞性題', grammar: '文法題',
  part6: '段落填空', part7: '閱讀理解'
};
const KIND_LABEL = { single: '單篇', double: '雙篇', triple: '三篇' };

function typeLabel(item) {
  const t = TYPE_LABEL[item.type] || '題目';
  return `Part ${item.part}・${t}`;
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// 打亂單一題目的選項，並把 answer 索引指回原本那個正確選項
function shuffleOptions(item) {
  const correctText = item.options[item.answer];
  const options = shuffle(item.options);
  return Object.assign({}, item, { options, answer: options.indexOf(correctText) });
}

function partPool() {
  return DATA[state.level].quiz.filter((q) => state.parts.includes(q.part));
}

function renderPartPicker() {
  const lv = DATA[state.level];
  const wrap = $('partPicker');
  wrap.innerHTML = '';
  PART_ORDER.forEach((n) => {
    const info = PART_INFO[n];
    const total = lv.quiz.filter((q) => q.part === n).length;
    const on = state.parts.includes(n);
    const b = document.createElement('button');
    b.className = 'part-btn' + (on ? ' active' : '');
    b.innerHTML = `
      <span class="part-name">${info.name}</span>
      <span class="part-zh">${info.zh}</span>
      <span class="part-desc">${info.desc}</span>
      <span class="part-total">${total} 題</span>`;
    b.onclick = () => {
      const i = state.parts.indexOf(n);
      if (i === -1) state.parts.push(n);
      else if (state.parts.length > 1) state.parts.splice(i, 1); // 至少要留一個
      renderPartPicker();
      updateQuizCount();
    };
    wrap.appendChild(b);
  });
}

function updateQuizCount() {
  $('quizCount').textContent = partPool().length;
}

function resetQuizView() {
  const prog = levelProgress(state.level);
  renderPartPicker();
  updateQuizCount();
  $('quizBest').textContent = prog.best ? `目前最佳成績：${bestText(prog.best)}` : '';
  $('quizIntro').classList.remove('hidden');
  $('quizPlay').classList.add('hidden');
  $('quizResult').classList.add('hidden');
}

function startQuiz() {
  const lv = DATA[state.level];
  const prog = levelProgress(state.level);

  // 保留題目在題庫中的原始索引 _i，才能記錄「哪幾題答對過」
  const pool = lv.quiz
    .map((q, i) => Object.assign({ _i: i }, q))
    .filter((q) => state.parts.includes(q.part));

  // Part 6/7 的同一篇文章要黏在一起出，否則會反覆重讀同一篇短文
  const groups = [];
  const byPassage = {};
  pool.forEach((q) => {
    if (!q.passage) { groups.push([q]); return; }
    if (!byPassage[q.passage.id]) { byPassage[q.passage.id] = []; groups.push(byPassage[q.passage.id]); }
    byPassage[q.passage.id].push(q);
  });

  let ordered = $('shuffleToggle').checked ? shuffle(groups) : groups;
  if ($('freshToggle').checked) {
    const hasFresh = (g) => g.some((q) => !prog.correct.includes(q._i));
    ordered = ordered.filter(hasFresh).concat(ordered.filter((g) => !hasFresh(g)));
  }

  // 依題數上限收題，但不切斷同一篇文章的題組
  let items = [];
  if (state.roundSize > 0) {
    for (const g of ordered) {
      if (items.length && items.length + g.length > state.roundSize) continue;
      items = items.concat(g);
      if (items.length >= state.roundSize) break;
    }
  } else {
    items = ordered.flat();
  }

  // 每回合重新排列四個選項，避免正確答案長期集中在同一個位置
  items = items.map(shuffleOptions);

  state.quiz = { items, index: 0, score: 0, wrong: [], answered: false };
  $('quizIntro').classList.add('hidden');
  $('quizResult').classList.add('hidden');
  $('quizPlay').classList.remove('hidden');
  renderQuestion();
}

// 把純文字安全地放進 HTML
function esc(s) {
  return String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
}

function renderPassage(item) {
  const box = $('passageBox');
  if (!item.passage) { box.classList.add('hidden'); box.innerHTML = ''; return; }
  box.classList.remove('hidden');

  if (item.part === 6) {
    // 短文中的 ___1___ 換成可視的空格，目前作答的那一格會高亮
    const body = esc(item.passage.text).replace(/___(\d)___/g, (m, n) =>
      `<span class="pblank${+n === item.blankNo ? ' current' : ''}">(${n})</span>`);
    box.innerHTML = `
      <div class="passage-head"><span class="doc-label">${esc(item.passage.label)}</span>${esc(item.passage.title)}</div>
      <div class="passage-body">${body}</div>`;
    return;
  }

  const kind = KIND_LABEL[item.passage.kind] || '';
  box.innerHTML =
    `<div class="passage-head"><span class="doc-label">${kind}</span>${item.passage.docs.length} 份文件</div>` +
    item.passage.docs.map((d) => `
      <div class="passage-doc">
        <div class="doc-title">${esc(d.label)}</div>
        <div class="passage-body">${esc(d.text)}</div>
      </div>`).join('');
}

function renderQuestion() {
  const q = state.quiz;
  const item = q.items[q.index];
  q.answered = false;

  $('quizBarFill').style.width = `${(q.index / q.items.length) * 100}%`;
  $('quizProgress').textContent = `第 ${q.index + 1} / ${q.items.length} 題`;
  $('quizScore').textContent = `答對 ${q.score} 題`;
  $('quizType').textContent = typeLabel(item);
  renderPassage(item);
  $('quizQuestion').textContent = item.question;
  $('quizFeedback').classList.add('hidden');
  $('nextQuestion').classList.add('hidden');
  $('nextQuestion').textContent =
    q.index === q.items.length - 1 ? '看結果 →' : '下一題 →';

  const box = $('quizOptions');
  box.innerHTML = '';
  item.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = `<span class="key">${'ABCD'[i]}</span><span>${opt}</span>`;
    btn.onclick = () => answer(i);
    box.appendChild(btn);
  });
}

function answer(picked) {
  const q = state.quiz;
  if (q.answered) return;
  q.answered = true;

  const item = q.items[q.index];
  const correct = picked === item.answer;
  const btns = [...document.querySelectorAll('#quizOptions .opt')];

  btns.forEach((b, i) => {
    b.disabled = true;
    if (i === item.answer) b.classList.add('correct');
    if (i === picked && !correct) b.classList.add('wrong');
  });

  if (correct) {
    q.score++;
    const prog = levelProgress(state.level);
    if (!prog.correct.includes(item._i)) {
      prog.correct.push(item._i);
      updateLevelProgress(state.level, { correct: prog.correct });
    }
  } else {
    q.wrong.push({
      question: item.question,
      correct: item.options[item.answer],
      picked: item.options[picked],
      explain: item.explain
    });
  }

  const fb = $('quizFeedback');
  fb.className = 'quiz-feedback ' + (correct ? 'ok' : 'bad');
  fb.innerHTML = correct
    ? `<span class="tag">✓ 答對了！</span>${item.explain}`
    : `<span class="tag">✗ 答錯了</span>正確答案：<strong>${item.options[item.answer]}</strong><br>${item.explain}`;

  $('quizScore').textContent = `答對 ${q.score} 題`;
  $('nextQuestion').classList.remove('hidden');
}

function nextQuestion() {
  const q = state.quiz;
  if (!q.answered) return;
  if (q.index < q.items.length - 1) {
    q.index++;
    renderQuestion();
  } else {
    finishQuiz();
  }
}

function finishQuiz() {
  const q = state.quiz;
  const total = q.items.length;
  const pct = Math.round((q.score / total) * 100);

  const prog = levelProgress(state.level);
  if (!prog.best || q.score / total > prog.best.score / prog.best.total) {
    updateLevelProgress(state.level, { best: { score: q.score, total: total } });
  }

  $('quizPlay').classList.add('hidden');
  $('quizResult').classList.remove('hidden');
  $('scoreText').textContent = `${q.score} / ${total}`;
  document.querySelector('.score-ring').style.setProperty('--pct', pct + '%');

  $('scoreComment').textContent =
    pct === 100 ? '完美！可以挑戰下一個等級了 🎉'
    : pct >= 80 ? '很不錯！再複習一下錯的題目就更穩了。'
    : pct >= 60 ? '及格了，建議回去把單字卡再翻一輪。'
    : '別灰心，先看單字與語法說明，再回來挑戰一次！';

  const rev = $('wrongReview');
  if (q.wrong.length === 0) {
    rev.innerHTML = '<p class="score-comment">這次沒有答錯的題目 👏</p>';
  } else {
    rev.innerHTML =
      '<h4 style="margin-bottom:10px">錯題回顧</h4>' +
      q.wrong.map((w) => `
        <div class="wrong-item">
          <div class="q">${w.question}</div>
          <div>你的答案：${w.picked}　|　<span class="a">正解：${w.correct}</span></div>
          <div class="e">${w.explain}</div>
        </div>`).join('');
  }
}

/* ---------------- 事件綁定 ---------------- */
$('btnHome').onclick = goHome;
document.querySelectorAll('.tab').forEach((t) => {
  t.onclick = () => switchTab(t.dataset.tab);
});
$('flashcard').onclick = () => $('flashcard').classList.toggle('flipped');
$('prevWord').onclick = () => moveWord(-1);
$('nextWord').onclick = () => moveWord(1);
$('markLearned').onclick = toggleLearned;
document.querySelectorAll('.size-btn').forEach((b) => {
  b.onclick = () => {
    state.roundSize = +b.dataset.size;
    document.querySelectorAll('.size-btn').forEach((x) => x.classList.toggle('active', x === b));
  };
});
$('startQuiz').onclick = startQuiz;
$('nextQuestion').onclick = nextQuestion;
$('retryQuiz').onclick = startQuiz;
$('backToStudy').onclick = () => { switchTab('words'); resetQuizView(); };

// 鍵盤操作：← → 換單字，空白鍵翻卡，1~4 選答案，Enter 下一題
document.addEventListener('keydown', (e) => {
  if (!state.level) return;
  const quizVisible = !$('tabQuiz').classList.contains('hidden');
  const playing = quizVisible && !$('quizPlay').classList.contains('hidden');

  if (playing) {
    if (['1', '2', '3', '4'].includes(e.key)) {
      const btns = document.querySelectorAll('#quizOptions .opt');
      const b = btns[+e.key - 1];
      if (b && !b.disabled) b.click();
    } else if (e.key === 'Enter') {
      nextQuestion();
    }
    return;
  }

  if (!$('tabWords').classList.contains('hidden')) {
    if (e.key === 'ArrowRight') moveWord(1);
    else if (e.key === 'ArrowLeft') moveWord(-1);
    else if (e.key === ' ') { e.preventDefault(); $('flashcard').click(); }
  }
});

/* ---------------- 啟動 ---------------- */
$('btnHome').style.visibility = 'hidden';
renderProfiles();
renderHome();

</script>

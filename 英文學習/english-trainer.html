<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>英文學習 English Trainer</title>
<style>
:root{
  --bg:#0f1220;
  --bg-soft:#171b2e;
  --card:#1e2338;
  --card-2:#262c45;
  --line:#333a58;
  --text:#e8ebf5;
  --muted:#98a0bd;
  --accent:#6c8cff;
  --accent-2:#9d7bff;
  --ok:#37d399;
  --bad:#ff6b81;
  --warn:#ffc857;
  --radius:16px;
}

*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Segoe UI","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
  background:radial-gradient(1200px 600px at 20% -10%,#26305a 0%,var(--bg) 55%) no-repeat,var(--bg);
  color:var(--text);
  min-height:100vh;
  line-height:1.7;
}

/* ---------- header ---------- */
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:18px 28px;border-bottom:1px solid var(--line);
  background:rgba(15,18,32,.7);backdrop-filter:blur(8px);
  position:sticky;top:0;z-index:10;
}
.brand{display:flex;align-items:center;gap:14px}
.logo{
  width:44px;height:44px;border-radius:12px;flex:none;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  display:grid;place-items:center;font-weight:800;letter-spacing:.5px;color:#fff;
}
.topbar h1{font-size:18px;font-weight:700}
.tagline{font-size:12px;color:var(--muted)}

main{max-width:900px;margin:0 auto;padding:28px 20px 60px}
.view.hidden,.tab-panel.hidden,.hidden{display:none}
.view-title{font-size:22px;margin-bottom:18px}

/* ---------- buttons ---------- */
button{font:inherit;cursor:pointer;border-radius:10px;transition:.15s}
.primary-btn{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  border:none;color:#fff;padding:10px 20px;font-weight:600;
}
.primary-btn:hover{filter:brightness(1.12)}
.primary-btn.big{padding:12px 28px;font-size:16px;margin-top:8px}
.ghost-btn{
  background:transparent;border:1px solid var(--line);color:var(--muted);padding:9px 16px;
}
.ghost-btn:hover{border-color:var(--accent);color:var(--text)}

/* ---------- 學習者記錄卡 ---------- */
.profile-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.profile-head .view-title{margin-bottom:0}
.profile-hint{font-size:12px;color:var(--muted)}
.profile-cards{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:12px;margin-bottom:34px;
}
.profile-card{
  background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;
  display:flex;flex-direction:column;gap:8px;
}
.profile-card.active{border-color:var(--accent);background:var(--card-2)}
.profile-top{display:flex;align-items:center;gap:8px}
.profile-name{
  flex:1;min-width:0;background:var(--bg-soft);border:1px solid var(--line);
  border-radius:8px;color:var(--text);font:inherit;font-size:15px;font-weight:600;
  padding:6px 10px;
}
.profile-name:focus{outline:none;border-color:var(--accent)}
.using-tag{
  flex:none;font-size:11px;color:#0f1220;background:var(--ok);
  border-radius:99px;padding:2px 9px;font-weight:700;
}
.profile-bar{height:5px;background:var(--bg-soft);border-radius:99px;overflow:hidden}
.profile-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .4s}
.profile-stat{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.profile-stat b{color:var(--text);font-size:14px}
.profile-sub{opacity:.8}
.profile-actions{display:flex;gap:8px;margin-top:2px}
.mini-btn{
  flex:1;background:transparent;border:1px solid var(--line);color:var(--muted);
  padding:6px 10px;font-size:12px;
}
.mini-btn:hover:not(:disabled){border-color:var(--accent);color:var(--text)}
.mini-btn:disabled{opacity:.45;cursor:default}
.mini-btn.danger:hover{border-color:var(--bad);color:var(--bad)}

/* ---------- 等級卡 ---------- */
.level-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.level-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:22px;cursor:pointer;transition:.18s;text-align:left;color:inherit;
}
.level-card:hover{transform:translateY(-3px);border-color:var(--accent)}
.level-card .lv-badge{
  display:inline-block;font-size:11px;letter-spacing:1px;text-transform:uppercase;
  color:#0f1220;background:var(--warn);padding:2px 10px;border-radius:99px;font-weight:700;
}
.level-card.lv-intermediate .lv-badge{background:#68d6ff}
.level-card.lv-advanced .lv-badge{background:var(--accent-2);color:#fff}
.level-card h3{font-size:24px;margin:12px 0 4px}
.level-card p{font-size:13px;color:var(--muted);min-height:42px}
.lv-stats{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}
.lv-stats b{color:var(--text)}

/* 空心圓餅圖進度 */
.donuts{display:flex;gap:10px;margin-top:16px;justify-content:space-between}
.donut-item{flex:1;text-align:center}
.donut{width:100%;max-width:62px;transform:rotate(-90deg)}
.donut-track,.donut-fill{fill:none;stroke-width:3.2}
.donut-track{stroke:var(--bg-soft)}
.donut-fill{stroke-linecap:round;transition:stroke-dasharray .5s ease}
.donut-pct{
  fill:var(--text);font-size:9px;font-weight:700;
  text-anchor:middle;dominant-baseline:middle;
  transform:rotate(90deg);transform-origin:18px 18px;
}
.donut-label{font-size:12px;color:var(--text);margin-top:2px}
.donut-count{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.hint{font-size:12px;color:var(--muted);margin-top:20px;text-align:center}

/* ---------- 分頁 ---------- */
.level-head{margin-bottom:16px}
.level-head h2{font-size:26px}
.level-desc{font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:8px;border-bottom:1px solid var(--line);margin-bottom:22px}
.tab{
  background:none;border:none;border-bottom:2px solid transparent;
  color:var(--muted);padding:10px 18px;border-radius:8px 8px 0 0;font-weight:600;
}
.tab.active{color:var(--text);border-bottom-color:var(--accent)}

/* ---------- 單字卡 ---------- */
.card-progress{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:10px}
.learned-counter{color:var(--ok)}
.flashcard{perspective:1200px;height:260px;cursor:pointer;margin-bottom:16px}
.flash-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flipped .flash-inner{transform:rotateY(180deg)}
.flash-face{
  position:absolute;inset:0;backface-visibility:hidden;
  background:linear-gradient(160deg,var(--card-2),var(--card));
  border:1px solid var(--line);border-radius:var(--radius);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:26px;text-align:center;gap:8px;
}
.flash-back{transform:rotateY(180deg)}
.word-en{font-size:40px;font-weight:700;letter-spacing:.5px}
.word-phonetic{color:var(--muted);font-size:16px}
.flip-hint{position:absolute;bottom:14px;font-size:12px;color:var(--muted)}
.word-zh{font-size:24px;font-weight:600}
.pos{color:var(--accent);font-size:14px;margin-right:8px}
.example{font-size:16px;margin-top:10px}
.example-zh{font-size:14px;color:var(--muted)}
.card-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:24px}
.word-list{list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.word-list li{
  background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:8px 12px;font-size:14px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;
}
.word-list li:hover{border-color:var(--accent)}
.word-list li.current{border-color:var(--accent);background:var(--card-2)}
.word-list li.learned::after{content:"✓";color:var(--ok)}

/* ---------- 語法 ---------- */
.grammar-item{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.grammar-head{
  width:100%;background:none;border:none;color:var(--text);text-align:left;
  padding:14px 18px;font-size:16px;font-weight:600;display:flex;justify-content:space-between;gap:10px;
}
.grammar-head .arrow{color:var(--muted);transition:.2s}
.grammar-item.open .arrow{transform:rotate(90deg)}
.grammar-body{padding:0 18px 16px;font-size:14px;border-top:1px dashed var(--line)}
.grammar-body .point{color:var(--muted);margin:12px 0}
.grammar-item.read .g-title::after{content:" ✓";color:var(--ok)}
.read-btn{
  margin-top:12px;background:transparent;border:1px solid var(--line);
  color:var(--muted);padding:6px 14px;font-size:13px;
}
.read-btn:hover{border-color:var(--ok);color:var(--text)}
.grammar-item.read .read-btn{border-color:var(--ok);color:var(--ok)}
.g-ex{background:var(--bg-soft);border-left:3px solid var(--accent);padding:8px 12px;border-radius:0 8px 8px 0;margin-top:8px}
.g-ex .en{font-size:15px}
.g-ex .zh{font-size:13px;color:var(--muted)}

/* ---------- 測驗 ---------- */
.quiz-box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px}
.quiz-box h3{font-size:20px;margin-bottom:10px}
.quiz-intro-text{color:var(--muted);font-size:14px}
.quiz-best{color:var(--warn);font-size:14px;margin-top:8px}
.shuffle-line{display:block;font-size:13px;color:var(--muted);margin:14px 0}
/* Part 選擇 */
.part-picker{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:16px}
.part-btn{
  background:var(--bg-soft);border:1px solid var(--line);color:var(--muted);
  padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:2px;
}
.part-btn:hover{border-color:var(--accent)}
.part-btn.active{border-color:var(--accent);background:var(--card-2)}
.part-btn .part-name{font-size:15px;font-weight:700;color:var(--muted)}
.part-btn.active .part-name{color:var(--accent)}
.part-btn .part-zh{font-size:13px;color:var(--text)}
.part-btn .part-desc{font-size:11px;line-height:1.5;margin-top:4px}
.part-btn .part-total{font-size:11px;color:var(--warn);margin-top:6px;font-variant-numeric:tabular-nums}
.part-btn.active::before{content:"✓ ";color:var(--ok)}
.part-summary{font-size:13px;color:var(--muted);margin-top:10px}
.part-summary strong{color:var(--text)}

/* Part 6 / 7 的文章區 */
.passage-box{
  background:var(--bg-soft);border:1px solid var(--line);border-radius:12px;
  padding:16px 18px;margin-bottom:18px;max-height:340px;overflow-y:auto;
}
.passage-head{
  font-size:12px;color:var(--muted);margin-bottom:10px;
  display:flex;align-items:center;gap:8px;
}
.doc-label{
  background:var(--card-2);color:var(--accent);border-radius:99px;
  padding:2px 10px;font-size:11px;font-weight:600;
}
.passage-doc{border-top:1px dashed var(--line);padding-top:12px;margin-top:12px}
.passage-doc:first-of-type{border-top:none;padding-top:0;margin-top:0}
.doc-title{font-size:12px;color:var(--accent-2);margin-bottom:6px;font-weight:600}
.passage-body{
  white-space:pre-wrap;font-size:14px;line-height:1.8;
  font-family:Consolas,"Courier New",ui-monospace,monospace;
}
.pblank{
  display:inline-block;min-width:34px;text-align:center;
  border-bottom:2px solid var(--muted);color:var(--muted);font-weight:700;
}
.pblank.current{border-bottom-color:var(--accent);color:var(--accent);background:rgba(108,140,255,.12)}

.round-size{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:18px}
.round-label{font-size:13px;color:var(--muted)}
.size-btns{display:flex;gap:6px}
.size-btn{
  background:var(--bg-soft);border:1px solid var(--line);color:var(--muted);
  padding:6px 14px;font-size:13px;
}
.size-btn:hover{border-color:var(--accent);color:var(--text)}
.size-btn.active{border-color:var(--accent);background:var(--card-2);color:var(--text);font-weight:600}
.quiz-bar{height:6px;background:var(--bg-soft);border-radius:99px;overflow:hidden;margin-bottom:12px}
.quiz-bar-fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .3s}
.quiz-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:14px}
.quiz-type{display:inline-block;font-size:11px;color:var(--accent);border:1px solid var(--accent);
  padding:1px 10px;border-radius:99px;margin-bottom:8px}
.quiz-question{font-size:20px;margin-bottom:18px;line-height:1.6}
.quiz-options{display:grid;gap:10px}
.opt{
  text-align:left;background:var(--bg-soft);border:1px solid var(--line);color:var(--text);
  padding:12px 16px;font-size:15px;display:flex;gap:12px;align-items:center;
}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt .key{
  width:24px;height:24px;flex:none;border-radius:6px;background:var(--card-2);
  display:grid;place-items:center;font-size:12px;color:var(--muted);
}
.opt.correct{border-color:var(--ok);background:rgba(55,211,153,.12)}
.opt.wrong{border-color:var(--bad);background:rgba(255,107,129,.12)}
.quiz-feedback{margin-top:16px;padding:12px 16px;border-radius:10px;font-size:14px;background:var(--bg-soft);border-left:3px solid var(--accent)}
.quiz-feedback.ok{border-left-color:var(--ok)}
.quiz-feedback.bad{border-left-color:var(--bad)}
.quiz-feedback .tag{font-weight:700;margin-right:6px}
#nextQuestion{margin-top:16px}

.score-ring{
  width:130px;height:130px;margin:16px auto;border-radius:50%;
  display:grid;place-items:center;font-size:26px;font-weight:700;
  background:conic-gradient(var(--accent) var(--pct,0%),var(--bg-soft) 0);
  position:relative;
}
.score-ring::before{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--card)}
.score-ring span{position:relative}
.score-comment{text-align:center;color:var(--muted);margin-bottom:18px}
.wrong-review{margin-bottom:18px}
.wrong-item{background:var(--bg-soft);border-radius:10px;padding:12px 16px;margin-bottom:8px;font-size:14px;border-left:3px solid var(--bad)}
.wrong-item .q{font-weight:600;margin-bottom:4px}
.wrong-item .a{color:var(--ok)}
.wrong-item .e{color:var(--muted);font-size:13px}

.foot{text-align:center;color:var(--muted);font-size:12px;padding:20px}

@media(max-width:600px){
  .topbar{padding:14px 16px}
  .topbar h1{font-size:15px}
  .word-en{font-size:32px}
  .flashcard{height:280px}
}

</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo">EN</span>
    <div>
      <h1>英文學習 English Trainer</h1>
      <p class="tagline">目前學習者：<span id="activeName">—</span></p>
    </div>
  </div>
  <button id="btnHome" class="ghost-btn">← 回到等級選擇</button>
</header>

<main>

  <!-- ===== 等級選擇 ===== -->
  <section id="viewHome" class="view">
    <div class="profile-head">
      <h2 class="view-title">學習者記錄</h2>
      <span class="profile-hint">可建立三組獨立進度，點「讀取進度」切換</span>
    </div>
    <div id="profileCards" class="profile-cards"></div>

    <h2 class="view-title">選擇你的學習等級</h2>
    <div id="levelCards" class="level-cards"></div>
    <div class="hint">學習進度會自動儲存在這台電腦的瀏覽器裡，關閉瀏覽器不會消失。</div>
  </section>

  <!-- ===== 學習 / 測驗 ===== -->
  <section id="viewLevel" class="view hidden">
    <div class="level-head">
      <h2 id="levelTitle">基礎</h2>
      <p id="levelDesc" class="level-desc"></p>
    </div>

    <nav class="tabs">
      <button class="tab active" data-tab="words">單字卡</button>
      <button class="tab" data-tab="grammar">語法</button>
      <button class="tab" data-tab="quiz">小測驗</button>
    </nav>

    <!-- 單字卡 -->
    <div id="tabWords" class="tab-panel">
      <div class="card-progress">
        <span id="wordCounter">1 / 10</span>
        <span id="learnedCounter" class="learned-counter"></span>
      </div>
      <div id="flashcard" class="flashcard">
        <div class="flash-inner">
          <div class="flash-face flash-front">
            <div class="word-en" id="fcWord"></div>
            <div class="word-phonetic" id="fcPhonetic"></div>
            <div class="flip-hint">點擊卡片看解答</div>
          </div>
          <div class="flash-face flash-back">
            <div class="word-zh"><span class="pos" id="fcPos"></span><span id="fcZh"></span></div>
            <div class="example" id="fcExample"></div>
            <div class="example-zh" id="fcExampleZh"></div>
          </div>
        </div>
      </div>
      <div class="card-actions">
        <button id="prevWord" class="ghost-btn">← 上一個</button>
        <button id="markLearned" class="primary-btn">標記為已學會</button>
        <button id="nextWord" class="ghost-btn">下一個 →</button>
      </div>
      <ul id="wordList" class="word-list"></ul>
    </div>

    <!-- 語法 -->
    <div id="tabGrammar" class="tab-panel hidden">
      <div class="card-progress"><span>展開文法重點閱讀後，可標記為已讀</span><span id="grammarCounter" class="learned-counter"></span></div>
      <div id="grammarList" class="grammar-list"></div>
    </div>

    <!-- 測驗 -->
    <div id="tabQuiz" class="tab-panel hidden">
      <!-- 開始畫面 -->
      <div id="quizIntro" class="quiz-box">
        <h3>多益模擬測驗</h3>
        <p class="quiz-intro-text">選擇要練習的題型。作答後會立即顯示對錯與中文解析。</p>
        <div id="partPicker" class="part-picker"></div>
        <p class="part-summary">已選範圍共 <strong id="quizCount">0</strong> 題</p>
        <div class="round-size">
          <span class="round-label">每回合題數</span>
          <div class="size-btns">
            <button class="size-btn active" data-size="10">10 題</button>
            <button class="size-btn" data-size="20">20 題</button>
            <button class="size-btn" data-size="0">全部</button>
          </div>
        </div>
        <label class="shuffle-line"><input type="checkbox" id="shuffleToggle" checked> 隨機抽題（關閉則依題庫順序）</label>
        <label class="shuffle-line"><input type="checkbox" id="freshToggle" checked> 優先出還沒答對過的題目</label>
        <p id="quizBest" class="quiz-best"></p>
        <button id="startQuiz" class="primary-btn big">開始測驗</button>
      </div>

      <!-- 作答畫面 -->
      <div id="quizPlay" class="quiz-box hidden">
        <div class="quiz-bar"><div id="quizBarFill" class="quiz-bar-fill"></div></div>
        <div class="quiz-meta">
          <span id="quizProgress">第 1 / 10 題</span>
          <span id="quizScore">答對 0 題</span>
        </div>
        <div id="quizType" class="quiz-type"></div>
        <div id="passageBox" class="passage-box hidden"></div>
        <h3 id="quizQuestion" class="quiz-question"></h3>
        <div id="quizOptions" class="quiz-options"></div>
        <div id="quizFeedback" class="quiz-feedback hidden"></div>
        <button id="nextQuestion" class="primary-btn hidden">下一題 →</button>
      </div>

      <!-- 結果畫面 -->
      <div id="quizResult" class="quiz-box hidden">
        <h3>測驗結果</h3>
        <div class="score-ring"><span id="scoreText">0 / 10</span></div>
        <p id="scoreComment" class="score-comment"></p>
        <div id="wrongReview" class="wrong-review"></div>
        <div class="card-actions">
          <button id="retryQuiz" class="primary-btn">再測一次</button>
          <button id="backToStudy" class="ghost-btn">回去複習單字</button>
        </div>
      </div>
    </div>
  </section>

</main>

<footer class="foot">離線可用 · 開啟 index.html 即可使用</footer>

<script>
/* 基礎 TOEIC 350-500：200 個高頻單字（依主題分組） */

const BASIC_WORDS = [

    { en: 'We signed the contract last Monday.', zh: '我們上週一簽了合約。' },
    { en: 'She sent the invoice yesterday.', zh: '她昨天寄出請款單。' } ] },

  { title: '過去式的否定與疑問：did', point: '否定用 did not（didn\'t）+ 原形動詞；疑問用 Did + 主詞 + 原形動詞。', examples: [
    { en: "He didn't attend the meeting.", zh: '他沒有出席會議。' },
    { en: 'Did you receive my email?', zh: '你收到我的信了嗎？' } ] },

  { title: '未來式：will', point: 'will + 原形動詞，用於當下決定、承諾或預測。多益公告大量使用。', examples: [
    { en: 'The shipment will arrive tomorrow morning.', zh: '貨物明天早上會送達。' },
    { en: 'I will call you as soon as I get home.', zh: '我一到家就打給你。' } ] },

  { title: '未來式：be going to', point: '用於已排定的計畫或有跡象的預測，後接原形動詞。', examples: [
    { en: 'The company is going to hire new staff next month.', zh: '公司下個月要聘請新員工。' },
    { en: 'Look at those clouds. It is going to rain.', zh: '看那些雲，快下雨了。' } ] },

  { title: '助動詞 can / could', point: 'can 表能力或許可；could 是過去式，也可用於更客氣的請求。', examples: [
    { en: 'You can pay by credit card.', zh: '您可以用信用卡付款。' },
    { en: 'Could you send me the file, please?', zh: '可以請你把檔案寄給我嗎？' } ] },

  { title: '助動詞 must / have to', point: 'must 表強制規定（多益公司規章常用）；have to 表客觀上必須，第三人稱單數用 has to。', examples: [
    { en: 'Employees must wear safety helmets in the factory.', zh: '員工在廠區內必須配戴安全帽。' },
    { en: 'She has to submit the form by Friday.', zh: '她必須在星期五前繳交表格。' } ] },

  { title: '助動詞 should / had better', point: 'should 表建議「應該」；had better 語氣更強，帶有警告意味。兩者後面都接原形動詞。', examples: [
    { en: 'You should check the figures again.', zh: '你應該再核對一次數字。' },
    { en: 'We had better leave now to avoid traffic.', zh: '我們最好現在出發以避開車潮。' } ] },

  { title: '助動詞 may / might', point: 'may 表允許或可能；might 語氣較不確定。多益公告常用 may 表「可以」。', examples: [
    { en: 'Visitors may use the parking lot free of charge.', zh: '訪客可免費使用停車場。' },
    { en: 'The delivery might be delayed by the storm.', zh: '出貨可能因為風暴而延誤。' } ] },

  { title: '冠詞 a / an', point: '看「發音」不是看字母：子音發音開頭用 a（a university、a one-day trip），母音發音開頭用 an（an hour、an honest employee）。', examples: [
    { en: 'She is an honest employee.', zh: '她是個誠實的員工。' },
    { en: 'He is a university graduate.', zh: '他是大學畢業生。' } ] },

  { title: '定冠詞 the 與零冠詞', point: '雙方都知道、獨一無二、或用片語限定的名詞用 the；泛指複數或不可數名詞不加冠詞。', examples: [
    { en: 'Mr. Chen is the manager of the Taipei office.', zh: '陳先生是台北辦公室的經理。' },
    { en: 'Employees receive free parking. (泛指)', zh: '員工享有免費停車。' } ] },

  { title: '名詞複數規則變化', point: '一般加 -s；字尾 s / x / ch / sh 加 -es；子音 + y 去 y 加 ies；字尾 f / fe 改 ves。', examples: [
    { en: 'two boxes, three cities, five shelves', zh: '兩個箱子、三座城市、五個架子' },
    { en: 'We have three boxes in the storage room.', zh: '倉庫裡有三個箱子。' } ] },

  { title: '不規則複數', point: 'child-children、person-people、man-men、woman-women、foot-feet；另有單複數同形：equipment、furniture 不可數，不加 -s。', examples: [
    { en: 'All the equipment has been checked. (不可數)', zh: '所有設備都已檢查過。' },
    { en: 'Three people attended the workshop.', zh: '三個人參加了工作坊。' } ] },

  { title: '可數與不可數名詞', point: '多益常考的不可數名詞：information、equipment、furniture、advice、luggage、paper（紙）、staff。它們不加 -s，動詞用單數。', examples: [
    { en: 'The information is available on our website.', zh: '這些資訊可在我們網站上取得。' },
    { en: 'You may bring one piece of luggage.', zh: '您可以攜帶一件行李。' } ] },

  { title: 'some / any', point: 'some 多用於肯定句與客氣的請求；any 用於否定句與疑問句。', examples: [
    { en: 'Would you like some coffee?', zh: '您要來點咖啡嗎？' },
    { en: 'We do not have any openings right now.', zh: '我們目前沒有任何職缺。' } ] },

  { title: 'many / much / a lot of', point: 'many + 可數複數；much + 不可數（多用於否定與疑問）；a lot of 兩者皆可。', examples: [
    { en: "There isn't much paper left in the printer.", zh: '印表機裡沒剩多少紙了。' },
    { en: 'Many applicants have submitted resumes.', zh: '許多應徵者已繳交履歷。' } ] },

  { title: 'a few / a little / few / little', point: 'a few + 可數（有一些）；a little + 不可數（有一點）；少了 a 就變成否定語氣「幾乎沒有」。', examples: [
    { en: 'We have a few samples left.', zh: '我們還剩幾個樣品。' },
    { en: 'There is little time before the deadline.', zh: '距離期限幾乎沒有時間了。' } ] },

  { title: '人稱代名詞：主格與受格', point: '主格當主詞（I, he, she, they）；受格放在動詞或介系詞之後（me, him, her, them）。', examples: [
    { en: 'She trained him last week.', zh: '她上週訓練了他。' },
    { en: 'Please send the report to me.', zh: '請把報告寄給我。' } ] },

  { title: '所有格與所有格代名詞', point: '所有格後面一定接名詞（my, your, his, their）；所有格代名詞單獨使用，後面不接名詞（mine, yours, his, theirs）。', examples: [
    { en: 'Please submit your report by Friday.', zh: '請在星期五前繳交你的報告。' },
    { en: 'This desk is mine; that one is hers.', zh: '這張桌子是我的，那張是她的。' } ] },

  { title: '反身代名詞', point: '主詞與受詞是同一人時使用（myself, yourself, himself, themselves），也可用來強調「親自」。', examples: [
    { en: 'The director introduced himself to the team.', zh: '總監向團隊自我介紹。' },
    { en: 'She wrote the report herself.', zh: '她親自寫了這份報告。' } ] },

  { title: '指示代名詞 this / that / these / those', point: 'this / these 指近的；that / those 指遠的。單數用 this / that，複數用 these / those。', examples: [
    { en: 'These are the files you requested.', zh: '這些是你要的檔案。' },
    { en: 'That model is no longer available.', zh: '那個型號已經沒有了。' } ] },

  { title: 'There is / There are', point: '表示某處「有」某物。單數或不可數用 There is，複數用 There are。', examples: [
    { en: 'There are several openings in our IT department.', zh: '我們資訊部門有幾個職缺。' },
    { en: 'There is a copy machine on each floor.', zh: '每層樓都有一台影印機。' } ] },

  { title: '疑問詞 what / where / when / who / why', point: '疑問詞放句首，後接助動詞或 be 動詞再接主詞。', examples: [
    { en: 'Where do you live?', zh: '你住在哪裡？' },
    { en: 'Why was the meeting canceled?', zh: '會議為什麼取消了？' } ] },

  { title: 'How much / How many / How long', point: 'How much + 不可數或問價格；How many + 可數複數；How long 問時間長度。', examples: [
    { en: 'How many copies do you need?', zh: '你需要幾份影本？' },
    { en: 'How long does the delivery take?', zh: '送貨要多久？' } ] },

  { title: '時間介系詞 in / on / at', point: 'at + 時刻（at 3 P.M.）；on + 星期或日期（on Monday）；in + 月份、年份、季節（in March）。', examples: [
    { en: 'The store opens at 9 A.M. every day.', zh: '這家店每天早上九點開門。' },
    { en: 'The conference will be held in March.', zh: '研討會將在三月舉行。' } ] },

  { title: '地點介系詞 in / on / at', point: 'in + 空間內部（in the office）；on + 平面或樓層（on the desk、on the third floor）；at + 定點（at the front desk）。', examples: [
    { en: 'The meeting room is on the third floor.', zh: '會議室在三樓。' },
    { en: 'Please wait at the front desk.', zh: '請在櫃檯等候。' } ] },

  { title: '其他常用介系詞 to / from / by / with', point: 'to 表方向或對象；from 表來源；by 表方式或期限；with 表工具或伴隨。', examples: [
    { en: 'Please send the file to the client by Friday.', zh: '請在星期五前把檔案寄給客戶。' },
    { en: 'You can pay by credit card.', zh: '您可以用信用卡付款。' } ] },

  { title: '頻率副詞', point: 'always → usually → often → sometimes → seldom → never。位置在 be 動詞「之後」、一般動詞「之前」。多益直接考位置。', examples: [
    { en: 'Mr. Kim is always on time for meetings.', zh: '金先生開會總是準時。' },
    { en: 'We usually place orders on Mondays.', zh: '我們通常在星期一下單。' } ] },

  { title: '形容詞的位置', point: '形容詞放在名詞「之前」，或放在 be、become、seem、look 等連綴動詞「之後」。', examples: [
    { en: 'This is an important announcement.', zh: '這是一則重要公告。' },
    { en: 'The customers seem satisfied.', zh: '顧客們似乎很滿意。' } ] },

  { title: '副詞的形成與位置', point: '多數形容詞加 -ly 變副詞；用來修飾動詞、形容詞或整句。注意例外：hard（努力地）、fast、late 本身就是副詞。', examples: [
    { en: 'Please read the instructions carefully.', zh: '請仔細閱讀說明。' },
    { en: 'The team responded quickly to the request.', zh: '團隊迅速回應了這項請求。' } ] },

  { title: '比較級', point: '短音節加 -er，多音節用 more；比較對象前加 than。不規則：good-better、bad-worse、many-more。', examples: [
    { en: 'This model is cheaper than that one.', zh: '這個型號比那個便宜。' },
    { en: "This year's results are better than last year's.", zh: '今年的業績比去年好。' } ] },

  { title: '最高級', point: '短音節加 -est，多音節用 most，前面通常加 the，後面常接 in / of 表範圍。', examples: [
    { en: 'This is our most popular item.', zh: '這是我們最熱門的商品。' },
    { en: 'He is the youngest member of the team.', zh: '他是團隊裡最年輕的成員。' } ] },

  { title: '同級比較 as ... as', point: 'as + 形容詞／副詞原級 + as，表示「和…一樣…」；否定用 not as / so ... as。', examples: [
    { en: 'This printer is as fast as the old one.', zh: '這台印表機和舊的一樣快。' },
    { en: 'The new plan is not as expensive as we thought.', zh: '新方案沒有我們想的那麼貴。' } ] },

  { title: '祈使句', point: '用原形動詞開頭，主詞 you 省略；否定用 Do not / Don\'t 開頭。多益的說明、公告、郵件指示幾乎都是祈使句。', examples: [
    { en: 'Please complete the form and send it back to us.', zh: '請填妥表格後寄回給我們。' },
    { en: "Don't send the documents to the wrong address.", zh: '別把文件寄錯地址。' } ] },

  { title: '對等連接詞 and / but / or / so', point: 'and 並列、but 轉折、or 選擇、so 表結果。連接的前後成分結構要對等。', examples: [
    { en: 'The flight was delayed, so we missed the meeting.', zh: '班機延誤，所以我們錯過了會議。' },
    { en: 'You may pay by cash or credit card.', zh: '您可以付現或刷卡。' } ] },

  { title: '從屬連接詞 because / when / if', point: 'because 表原因、when 表時間、if 表條件。注意中文的「因為…所以…」在英文只能擇一。', examples: [
    { en: 'She stayed late because she had to finish the report.', zh: '她因為得完成報告而留到很晚。' },
    { en: 'Call me when you arrive at the airport.', zh: '你到機場時打給我。' } ] },

  { title: '動詞後接不定詞 to V', point: 'want、plan、decide、hope、need、agree、would like 之後接 to + 原形動詞。', examples: [
    { en: 'We plan to open a new branch next year.', zh: '我們計畫明年開新分店。' },
    { en: 'She decided to accept the offer.', zh: '她決定接受這份工作。' } ] },

  { title: '動詞後接動名詞 V-ing', point: 'enjoy、finish、avoid、mind、consider、suggest 之後接動名詞；介系詞（in、on、for、to 當介系詞時）之後也接 V-ing。', examples: [
    { en: 'We finished reviewing the contract yesterday.', zh: '我們昨天審完了合約。' },
    { en: 'Thank you for helping us with the event.', zh: '感謝你協助我們辦這場活動。' } ] },

  { title: '詞性與空格位置（詞性題基礎）', point: '看「位置」判斷詞性：冠詞或所有格之後放名詞；名詞之前放形容詞；be 動詞之後放形容詞；動詞或形容詞旁邊放副詞；介系詞之後放名詞或動名詞。', examples: [
    { en: 'Thank you for your cooperation. (所有格 + 名詞)', zh: '感謝您的配合。' },
    { en: 'Please respond immediately. (動詞 + 副詞)', zh: '請立即回覆。' } ] },

  { title: '常見動詞搭配（多益必背）', point: 'attend a meeting（出席會議）、place an order（下訂單）、make a reservation（訂位）、submit a report（繳交報告）、take a message（留言）、reach an agreement（達成協議）。', examples: [
    { en: 'Ms. Chen will attend the sales meeting on Friday.', zh: '陳女士週五會出席業務會議。' },
    { en: 'I would like to make a reservation for two.', zh: '我想訂兩位的位子。' } ] }
];

<script>

const BASIC_QUIZ = [
  /* ══════════ 詞彙題 72 ══════════ */
  { type: 'vocab', question: 'We need to order more office ____ before the end of the month.', options: ['samples', 'supplies', 'receipts', 'labels'], answer: 1, explain: 'office supplies＝辦公用品，是固定搭配。' },
  { type: 'vocab', question: 'Please put the signed ____ in the blue folder.', options: ['machine', 'screen', 'document', 'drawer'], answer: 2, explain: '可以簽名的是 document（文件）。' },
  { type: 'vocab', question: 'All ____ must be checked before the annual inspection.', options: ['equipment', 'entrance', 'envelope', 'evidence'], answer: 0, explain: 'equipment＝設備，是不可數名詞，不加 -s。' },
  { type: 'vocab', question: "Write the customer's address on the ____.", options: ['elevator', 'expense', 'envelope', 'exit'], answer: 2, explain: '寫地址的是 envelope（信封）。' },
  { type: 'vocab', question: 'Old records are kept in the filing ____ near the window.', options: ['catalog', 'counter', 'ceiling', 'cabinet'], answer: 3, explain: 'filing cabinet＝檔案櫃。' },
  { type: 'vocab', question: 'Each box has a ____ showing its contents.', options: ['label', 'lobby', 'ladder', 'letter'], answer: 0, explain: 'label＝標籤，貼在箱子上標示內容物。' },
  { type: 'vocab', question: 'The company will ____ ten new workers this quarter.', options: ['hold', 'hurry', 'hire', 'higher'], answer: 2, explain: 'hire＝聘用。higher 是形容詞比較級，不能當動詞。' },
  { type: 'vocab', question: 'Please attach your ____ to the application email.', options: ['receipt', 'resume', 'reservation', 'refund'], answer: 1, explain: '應徵時附上的是 resume（履歷表）。' },
  { type: 'vocab', question: 'Your ____ is scheduled for Monday at ten.', options: ['invoice', 'inventory', 'interview', 'entrance'], answer: 2, explain: '排定時間進行的是 interview（面試）。' },
  { type: 'vocab', question: 'Every ____ must provide two references.', options: ['supplier', 'passenger', 'colleague', 'applicant'], answer: 3, explain: '需要提供推薦人的是 applicant（應徵者）。' },
  { type: 'vocab', question: 'The ____ depends on your years of experience.', options: ['safety', 'salary', 'sample', 'service'], answer: 1, explain: 'salary＝薪水，與經驗年資相關。' },
  { type: 'vocab', question: 'He received a ____ to senior manager last month.', options: ['promotion', 'permission', 'prevention', 'population'], answer: 0, explain: 'receive a promotion＝獲得升遷。' },
  { type: 'vocab', question: 'New staff must complete safety ____ before starting work.', options: ['traffic', 'trial', 'training', 'transport'], answer: 2, explain: 'safety training＝安全訓練。' },
  { type: 'vocab', question: 'This position requires three years of ____ in sales.', options: ['expense', 'experience', 'equipment', 'exchange'], answer: 1, explain: 'years of experience＝多年經驗。' },
  { type: 'vocab', question: 'Computer ____ are required for this role.', options: ['signs', 'sales', 'skills', 'spaces'], answer: 2, explain: 'computer skills＝電腦技能。' },
  { type: 'vocab', question: "The ____ for tomorrow's meeting was sent out yesterday.", options: ['area', 'amount', 'arrival', 'agenda'], answer: 3, explain: 'agenda＝議程，會議前發送。' },
  { type: 'vocab', question: 'Her ____ on the new product was very clear.', options: ['presentation', 'permission', 'population', 'preparation'], answer: 0, explain: 'give a presentation on＝針對…做簡報。' },
  { type: 'vocab', question: 'Ms. Chen will ____ the sales meeting on Friday.', options: ['arrive', 'appear', 'admit', 'attend'], answer: 3, explain: 'attend a meeting＝出席會議。arrive 後面須加 at / in。' },
  { type: 'vocab', question: 'The outdoor event was ____ because of the storm.', options: ['collected', 'canceled', 'connected', 'corrected'], answer: 1, explain: 'be canceled＝被取消。' },
  { type: 'vocab', question: 'The meeting has been ____ to next Tuesday.', options: ['prepared', 'provided', 'postponed', 'promoted'], answer: 2, explain: 'postpone A to B＝把 A 延到 B。' },
  { type: 'vocab', question: 'Please ____ your reservation at least 24 hours in advance.', options: ['confirm', 'contain', 'control', 'continue'], answer: 0, explain: 'confirm a reservation＝確認訂位。' },
  { type: 'vocab', question: 'I will ____ a meeting with the client next week.', options: ['arrive', 'announce', 'arrange', 'allow'], answer: 2, explain: 'arrange a meeting＝安排會議。' },
  { type: 'vocab', question: 'Please ____ me to call the supplier this afternoon.', options: ['remove', 'rename', 'remind', 'replace'], answer: 2, explain: 'remind + 人 + to V＝提醒某人做某事。' },
  { type: 'vocab', question: 'The ____ for the quarterly report is next Wednesday.', options: ['deadline', 'decision', 'delivery', 'department'], answer: 0, explain: 'deadline＝截止期限。' },
  { type: 'vocab', question: 'The manager will ____ the contract before signing it.', options: ['reverse', 'review', 'remove', 'reduce'], answer: 1, explain: 'review a contract＝審閱合約。' },
  { type: 'vocab', question: 'The board made a final ____ about the merger.', options: ['direction', 'description', 'decision', 'destination'], answer: 2, explain: 'make a decision＝做決定。' },
  { type: 'vocab', question: 'The company ____ a new product line yesterday.', options: ['answered', 'announced', 'applied', 'appeared'], answer: 1, explain: 'announce＝宣布（新產品、新政策）。' },
  { type: 'vocab', question: 'This ____ is currently out of stock.', options: ['idea', 'image', 'item', 'issue'], answer: 2, explain: 'item＝商品品項；out of stock＝缺貨。' },
  { type: 'vocab', question: 'We work with three local ____ in this region.', options: ['subways', 'suppliers', 'surfaces', 'summaries'], answer: 1, explain: 'supplier＝供應商。' },
  { type: 'vocab', question: 'Please check the ____ of each box; there should be 24 units.', options: ['quality', 'question', 'quote', 'quantity'], answer: 3, explain: 'quantity＝數量（幾個）；quality 是「品質」。' },
  { type: 'vocab', question: 'The ____ arrived at the warehouse this morning.', options: ['shipment', 'statement', 'situation', 'selection'], answer: 0, explain: 'shipment＝出貨、貨運批次。' },
  { type: 'vocab', question: 'A ____ was left at the front desk for Mr. Lee.', options: ['passport', 'password', 'pattern', 'package'], answer: 3, explain: 'package＝包裹。' },
  { type: 'vocab', question: 'This model is no longer in ____.', options: ['stock', 'store', 'stand', 'state'], answer: 0, explain: 'in stock＝有庫存；no longer in stock＝已無貨。' },
  { type: 'vocab', question: 'You need a ____ to get a refund.', options: ['recipe', 'receipt', 'request', 'resume'], answer: 1, explain: 'receipt＝收據；recipe 是食譜，拼字易混淆。' },
  { type: 'vocab', question: 'A free ____ will be sent to you next week.', options: ['salary', 'session', 'sample', 'series'], answer: 2, explain: 'a free sample＝免費樣品。' },
  { type: 'vocab', question: 'You can view our full ____ online.', options: ['cabinet', 'calendar', 'campaign', 'catalog'], answer: 3, explain: 'catalog＝產品型錄。' },
  { type: 'vocab', question: 'They sent us a ____ for the new equipment.', options: ['quote', 'quiz', 'queue', 'quarter'], answer: 0, explain: 'quote＝報價（單）。' },
  { type: 'vocab', question: 'The ____ offered a lower price than its competitors.', options: ['visitor', 'veteran', 'vendor', 'volunteer'], answer: 2, explain: 'vendor＝廠商、賣方。' },
  { type: 'vocab', question: 'Our ____ service is open until 6 P.M.', options: ['customer', 'container', 'calendar', 'corridor'], answer: 0, explain: 'customer service＝客戶服務。' },
  { type: 'vocab', question: 'Members receive a 20% ____ on all items.', options: ['deposit', 'decision', 'discount', 'division'], answer: 2, explain: 'receive a discount＝獲得折扣。' },
  { type: 'vocab', question: 'You can request a ____ within 30 days of purchase.', options: ['reform', 'refund', 'report', 'resume'], answer: 1, explain: 'request a refund＝申請退款。' },
  { type: 'vocab', question: 'We received a ____ about the late delivery.', options: ['compliment', 'component', 'complaint', 'container'], answer: 2, explain: 'complaint＝客訴；compliment 是「稱讚」，意思相反。' },
  { type: 'vocab', question: 'Most customers are ____ with our new delivery service.', options: ['surprised', 'confused', 'worried', 'satisfied'], answer: 3, explain: 'be satisfied with＝對…感到滿意。' },
  { type: 'vocab', question: 'The ____ of the fabric is excellent.', options: ['quantity', 'quality', 'quarter', 'question'], answer: 1, explain: 'quality＝品質（好壞）；quantity 是數量。' },
  { type: 'vocab', question: 'The store ____ free delivery this week only.', options: ['orders', 'opens', 'offers', 'owns'], answer: 2, explain: 'offer free delivery＝提供免運。' },
  { type: 'vocab', question: 'Your ____ expires at the end of June.', options: ['membership', 'management', 'movement', 'measurement'], answer: 0, explain: 'membership＝會員資格。' },
  { type: 'vocab', question: 'Use this ____ at the cashier for 10% off.', options: ['contract', 'coupon', 'catalog', 'container'], answer: 1, explain: 'coupon＝優惠券。' },
  { type: 'vocab', question: 'I would ____ the newer model for your needs.', options: ['remind', 'remove', 'replace', 'recommend'], answer: 3, explain: 'recommend＝推薦。' },
  { type: 'vocab', question: 'This is our most ____ item this season.', options: ['popular', 'possible', 'previous', 'personal'], answer: 0, explain: 'popular＝受歡迎的、熱銷的。' },
  { type: 'vocab', question: 'Payment is ____ within 14 days of the invoice date.', options: ['dues', 'duty', 'due', 'during'], answer: 2, explain: 'be due＝到期、應支付。' },
  { type: 'vocab', question: 'There is a small service ____ for online orders.', options: ['few', 'feed', 'field', 'fee'], answer: 3, explain: 'service fee＝服務費。' },
  { type: 'vocab', question: 'The project is over ____ by twenty thousand dollars.', options: ['building', 'budget', 'bundle', 'business'], answer: 1, explain: 'over budget＝超出預算。' },
  { type: 'vocab', question: 'Please log in to your ____ to view the order status.', options: ['account', 'amount', 'agent', 'agenda'], answer: 0, explain: 'log in to your account＝登入你的帳戶。' },
  { type: 'vocab', question: 'The hotel ____ extra for parking.', options: ['changes', 'chooses', 'charges', 'checks'], answer: 2, explain: 'charge＝收費、索價。' },
  { type: 'vocab', question: 'Travel ____ will be paid by the company.', options: ['exchanges', 'examples', 'expenses', 'exercises'], answer: 2, explain: 'travel expenses＝差旅費。' },
  { type: 'vocab', question: 'Please check the ____ on the invoice before paying.', options: ['agenda', 'amount', 'arrival', 'area'], answer: 1, explain: 'amount＝金額。' },
  { type: 'vocab', question: 'Buying in bulk ____ money in the long run.', options: ['saves', 'spends', 'sells', 'sends'], answer: 0, explain: 'save money＝省錢。' },
  { type: 'vocab', question: 'The company made a small ____ last quarter.', options: ['project', 'product', 'promise', 'profit'], answer: 3, explain: 'make a profit＝獲利。' },
  { type: 'vocab', question: 'Sales ____ by ten percent after the campaign.', options: ['included', 'increased', 'informed', 'insisted'], answer: 1, explain: 'increase by + 幅度＝成長了…。' },
  { type: 'vocab', question: 'The hotel offers a special ____ for group bookings.', options: ['rank', 'range', 'rate', 'ratio'], answer: 2, explain: 'a special rate＝特惠價格。' },
  { type: 'vocab', question: 'My ____ leaves at seven in the morning.', options: ['floor', 'flight', 'flow', 'fleet'], answer: 1, explain: 'flight＝班機。' },
  { type: 'vocab', question: 'All ____ must show identification before boarding.', options: ['packages', 'patterns', 'payments', 'passengers'], answer: 3, explain: 'passenger＝乘客。' },
  { type: 'vocab', question: 'You may bring one piece of ____ on board.', options: ['luggage', 'language', 'laundry', 'leisure'], answer: 0, explain: 'luggage＝行李，不可數，用 a piece of 計量。' },
  { type: 'vocab', question: 'The ____ time has been changed to 8:15.', options: ['department', 'deposit', 'departure', 'decision'], answer: 2, explain: 'departure time＝出發時間。' },
  { type: 'vocab', question: 'The flight was ____ by two hours due to bad weather.', options: ['denied', 'decided', 'delivered', 'delayed'], answer: 3, explain: 'be delayed by＝延誤了（多久）。' },
  { type: 'vocab', question: 'I have a ____ under the name Chen.', options: ['registration', 'reservation', 'recreation', 'reception'], answer: 1, explain: 'have a reservation＝有訂位／訂房。' },
  { type: 'vocab', question: 'Public ____ is very convenient in this city.', options: ['translation', 'transaction', 'transportation', 'transmission'], answer: 2, explain: 'public transportation＝大眾運輸。' },
  { type: 'vocab', question: 'She was late because of heavy ____.', options: ['traffic', 'transfer', 'terminal', 'trainer'], answer: 0, explain: 'heavy traffic＝交通壅塞。' },
  { type: 'vocab', question: 'The emergency ____ is at the back of the building.', options: ['entry', 'event', 'exit', 'effort'], answer: 2, explain: 'emergency exit＝緊急出口。' },
  { type: 'vocab', question: 'The ____ is under repair, so please use the stairs.', options: ['envelope', 'elevator', 'equipment', 'exhibit'], answer: 1, explain: 'elevator＝電梯；壞了才需要走樓梯。' },
  { type: 'vocab', question: 'Regular ____ is required to keep the machines running.', options: ['management', 'membership', 'measurement', 'maintenance'], answer: 3, explain: 'regular maintenance＝定期維護。' },
  { type: 'vocab', question: 'The road is closed for ____ until next month.', options: ['construction', 'consumption', 'contribution', 'conversation'], answer: 0, explain: 'closed for construction＝因施工封閉。' },

  /* ══════════ 詞性題 40 ══════════ */
  { type: 'form', question: 'Thank you for your ____ during the system upgrade.', options: ['cooperate', 'cooperative', 'cooperation', 'cooperatively'], answer: 2, explain: '所有格 your 之後必須接名詞 → cooperation。' },
  { type: 'form', question: 'The manager gave a very ____ presentation.', options: ['success', 'successful', 'successfully', 'succeed'], answer: 1, explain: 'very + 形容詞 + 名詞：修飾 presentation 用形容詞 successful。' },
  { type: 'form', question: 'Please read the instructions ____ before using the machine.', options: ['care', 'careful', 'carefully', 'careless'], answer: 2, explain: '修飾動詞 read 要用副詞 carefully。' },
  { type: 'form', question: 'All applications must include proof of ____.', options: ['employ', 'employed', 'employment', 'employable'], answer: 2, explain: '介系詞 of 之後接名詞 → proof of employment（在職證明）。' },
  { type: 'form', question: 'The team worked ____ to finish the project on time.', options: ['quick', 'quickly', 'quicker', 'quickness'], answer: 1, explain: '修飾動詞 worked 要用副詞 quickly。' },
  { type: 'form', question: 'We appreciate your ____ during the renovation.', options: ['patient', 'patience', 'patiently', 'patients'], answer: 1, explain: '所有格之後接名詞；patience 是耐心，patients 是病患。' },
  { type: 'form', question: 'The ____ of the new store will take place in June.', options: ['open', 'opens', 'opening', 'opened'], answer: 2, explain: '冠詞 The 之後、of 之前需要名詞 → opening（開幕）。' },
  { type: 'form', question: 'Our products are known for their ____.', options: ['reliable', 'reliably', 'reliability', 'rely'], answer: 2, explain: '所有格 their 之後接名詞 → reliability。' },
  { type: 'form', question: 'Mr. Wang is a very ____ employee.', options: ['help', 'helps', 'helpful', 'helpfully'], answer: 2, explain: '修飾名詞 employee 用形容詞 helpful。' },
  { type: 'form', question: 'The company announced its ____ to expand overseas.', options: ['decide', 'decided', 'decision', 'decisively'], answer: 2, explain: '所有格 its 之後接名詞 → decision to V。' },
  { type: 'form', question: 'The new policy will improve office ____.', options: ['safe', 'safely', 'safety', 'safer'], answer: 2, explain: '及物動詞 improve 之後接名詞 → office safety。' },
  { type: 'form', question: 'The instructions are written very ____.', options: ['clear', 'clearly', 'clearness', 'clearer'], answer: 1, explain: '修飾動詞片語 are written 要用副詞 clearly。' },
  { type: 'form', question: 'Please give us your ____ as soon as possible.', options: ['approve', 'approved', 'approval', 'approvingly'], answer: 2, explain: '所有格 your 之後接名詞 → approval（批准）。' },
  { type: 'form', question: 'The new assistant is extremely ____.', options: ['organize', 'organized', 'organization', 'organizing'], answer: 1, explain: 'be + 副詞 + 形容詞：organized 當形容詞表「有條理的」。' },
  { type: 'form', question: 'This machine operates ____ than the old one.', options: ['quiet', 'quietly', 'more quietly', 'quietest'], answer: 2, explain: '有 than 用比較級；修飾動詞 operates 要用副詞 → more quietly。' },
  { type: 'form', question: 'We offer ____ delivery to all customers.', options: ['free', 'freely', 'freedom', 'frees'], answer: 0, explain: '修飾名詞 delivery 用形容詞 free。' },
  { type: 'form', question: 'The report includes a ____ of last year’s sales.', options: ['summarize', 'summary', 'summarized', 'summarily'], answer: 1, explain: '冠詞 a 之後需要名詞 → summary（摘要）。' },
  { type: 'form', question: 'All staff members were ____ informed of the change.', options: ['proper', 'properly', 'property', 'properness'], answer: 1, explain: '修飾過去分詞 informed 要用副詞 properly。' },
  { type: 'form', question: 'The training session was highly ____.', options: ['use', 'used', 'useful', 'usefully'], answer: 2, explain: 'be 動詞 + 副詞 highly 之後接形容詞 useful。' },
  { type: 'form', question: 'Our goal is customer ____.', options: ['satisfy', 'satisfied', 'satisfaction', 'satisfactory'], answer: 2, explain: 'customer satisfaction＝顧客滿意度，是常見複合名詞。' },
  { type: 'form', question: 'She responded to the complaint very ____.', options: ['polite', 'politely', 'politeness', 'politest'], answer: 1, explain: '修飾動詞 responded 要用副詞 politely。' },
  { type: 'form', question: 'The manager made an ____ decision about the budget.', options: ['important', 'importantly', 'importance', 'import'], answer: 0, explain: '冠詞 an 與名詞 decision 之間要用形容詞 important。' },
  { type: 'form', question: 'The new software has increased our ____.', options: ['efficient', 'efficiently', 'efficiency', 'efficiencies'], answer: 2, explain: '及物動詞 increased 之後接名詞 → efficiency。' },
  { type: 'form', question: 'Please handle the equipment ____.', options: ['careful', 'carefully', 'care', 'caring'], answer: 1, explain: '修飾動詞 handle 要用副詞 carefully。' },
  { type: 'form', question: 'The store is ____ located near the station.', options: ['convenience', 'convenient', 'conveniently', 'conveniences'], answer: 2, explain: '修飾過去分詞 located 要用副詞 conveniently。' },
  { type: 'form', question: 'We need an ____ answer by Friday.', options: ['immediate', 'immediately', 'immediacy', 'immediateness'], answer: 0, explain: '冠詞 an 與名詞 answer 之間要用形容詞 immediate。' },
  { type: 'form', question: 'The delivery service is fast and ____.', options: ['rely', 'reliable', 'reliably', 'reliability'], answer: 1, explain: '與形容詞 fast 用 and 並列，也要用形容詞 reliable（平行結構）。' },
  { type: 'form', question: 'Employees should dress ____ at client meetings.', options: ['profession', 'professional', 'professionally', 'professionalism'], answer: 2, explain: '修飾動詞 dress 要用副詞 professionally。' },
  { type: 'form', question: 'The manual provides a clear ____ of each step.', options: ['explain', 'explained', 'explanation', 'explanatory'], answer: 2, explain: '形容詞 clear 之後需要名詞 → explanation。' },
  { type: 'form', question: 'The new branch has been ____ successful.', options: ['surprise', 'surprised', 'surprising', 'surprisingly'], answer: 3, explain: '修飾形容詞 successful 要用副詞 surprisingly。' },
  { type: 'form', question: 'We received several ____ about the new design.', options: ['comment', 'comments', 'commented', 'commenting'], answer: 1, explain: 'several 之後接可數名詞複數 → comments。' },
  { type: 'form', question: 'The offer is valid for a ____ time only.', options: ['limit', 'limited', 'limiting', 'limitation'], answer: 1, explain: '修飾名詞 time 用過去分詞當形容詞 limited（有限的）。' },
  { type: 'form', question: 'Please sign the form ____ the bottom of the page.', options: ['at', 'on', 'in', 'to'], answer: 0, explain: 'at the bottom of＝在…的底部，是固定介系詞搭配。' },
  { type: 'form', question: 'The meeting room can be used ____ by any department.', options: ['free', 'freely', 'freedom', 'freeing'], answer: 1, explain: '修飾動詞片語 be used 要用副詞 freely（自由地）。' },
  { type: 'form', question: 'His ____ to the team has been outstanding.', options: ['contribute', 'contributed', 'contribution', 'contributing'], answer: 2, explain: '所有格 His 之後接名詞 → contribution。' },
  { type: 'form', question: 'The printer works ____ than we expected.', options: ['well', 'better', 'best', 'good'], answer: 1, explain: '有 than 用比較級；修飾動詞 works 用副詞 well 的比較級 better。' },
  { type: 'form', question: 'Customers appreciate the ____ of our staff.', options: ['friendly', 'friendliness', 'friend', 'friendlier'], answer: 1, explain: '冠詞 the 之後、of 之前需要名詞 → friendliness。' },
  { type: 'form', question: 'The schedule was changed ____ last week.', options: ['sudden', 'suddenly', 'suddenness', 'more sudden'], answer: 1, explain: '修飾動詞片語 was changed 要用副詞 suddenly。' },
  { type: 'form', question: 'All rooms are cleaned on a ____ basis.', options: ['regular', 'regularly', 'regularity', 'regulate'], answer: 0, explain: 'on a regular basis＝定期地；basis 是名詞，前面用形容詞。' },
  { type: 'form', question: 'The company is looking for a ____ accountant.', options: ['qualify', 'qualified', 'qualification', 'qualifying'], answer: 1, explain: '修飾名詞 accountant 用過去分詞當形容詞 qualified（合格的）。' },

  /* ══════════ 文法題 88 ══════════ */
  { type: 'grammar', question: 'The office ____ closed on national holidays.', options: ['is', 'are', 'be', 'being'], answer: 0, explain: '主詞 The office 是單數，be 動詞用 is。' },
  { type: 'grammar', question: 'The customers ____ waiting in the lobby now.', options: ['is', 'are', 'was', 'be'], answer: 1, explain: '主詞複數且動作正在進行 → are waiting。' },
  { type: 'grammar', question: 'The manager ____ available until three this afternoon.', options: ['not is', 'is not', 'do not', 'does not'], answer: 1, explain: 'be 動詞的否定是在 be 之後加 not。' },
  { type: 'grammar', question: '____ the documents ready for the meeting?', options: ['Is', 'Are', 'Do', 'Does'], answer: 1, explain: '主詞 documents 是複數，be 動詞疑問句用 Are 開頭。' },
  { type: 'grammar', question: 'Ms. Lin ____ in the marketing department.', options: ['work', 'works', 'working', 'to work'], answer: 1, explain: '第三人稱單數主詞 + 現在簡單式，動詞加 -s。' },
  { type: 'grammar', question: 'The store ____ at nine every morning.', options: ['open', 'opens', 'opening', 'is open'], answer: 1, explain: '例行時間用現在簡單式，主詞單數加 -s。' },
  { type: 'grammar', question: 'He ____ work on weekends.', options: ["don't", "doesn't", "isn't", "wasn't"], answer: 1, explain: '第三人稱單數的現在式否定用 doesn\'t + 原形動詞。' },
  { type: 'grammar', question: '____ you need a receipt for your purchase?', options: ['Do', 'Does', 'Are', 'Is'], answer: 0, explain: '主詞 you + 一般動詞，疑問句用 Do 開頭。' },
  { type: 'grammar', question: 'Please note that the copier ____ at the moment.', options: ['is not working', 'not working', 'does not working', 'is not work'], answer: 0, explain: 'at the moment 表正在進行，現在進行式否定為 is not working。' },
  { type: 'grammar', question: 'Look! The technicians ____ the elevator now.', options: ['repair', 'repairs', 'are repairing', 'is repairing'], answer: 2, explain: 'Look! + now 表正在進行；主詞複數 → are repairing。' },
  { type: 'grammar', question: 'She usually ____ the subway, but today she is taking a taxi.', options: ['take', 'takes', 'is taking', 'took'], answer: 1, explain: 'usually 表習慣，用現在簡單式；主詞單數加 -s。' },
  { type: 'grammar', question: 'I ____ the answer to your question.', options: ['am knowing', 'know', 'knows', 'am know'], answer: 1, explain: 'know 是狀態動詞，通常不用進行式。' },
  { type: 'grammar', question: 'The meeting ____ very productive.', options: ['were', 'was', 'are', 'be'], answer: 1, explain: '主詞 The meeting 是單數，過去式 be 動詞用 was。' },
  { type: 'grammar', question: 'The files ____ on your desk yesterday.', options: ['was', 'were', 'is', 'are'], answer: 1, explain: '主詞 files 是複數，過去式用 were。' },
  { type: 'grammar', question: 'We ____ the contract last Monday.', options: ['sign', 'signs', 'signed', 'signing'], answer: 2, explain: 'last Monday 是過去時間，用過去式 signed。' },
  { type: 'grammar', question: 'She ____ the invoice to the client yesterday.', options: ['send', 'sends', 'sent', 'sending'], answer: 2, explain: 'send 的過去式是不規則變化 sent。' },
  { type: 'grammar', question: 'He ____ go to the training session yesterday.', options: ["doesn't", "didn't", "isn't", "wasn't"], answer: 1, explain: '過去式的否定用 didn\'t + 原形動詞。' },
  { type: 'grammar', question: '____ you receive my email this morning?', options: ['Do', 'Did', 'Are', 'Were'], answer: 1, explain: 'this morning 已過去，一般動詞疑問句用 Did。' },
  { type: 'grammar', question: 'The shipment ____ arrive tomorrow morning.', options: ['will', 'is', 'does', 'has'], answer: 0, explain: 'tomorrow 表未來，用 will + 原形動詞。' },
  { type: 'grammar', question: 'I ____ call you as soon as I get home.', options: ['will', 'am', 'do', 'was'], answer: 0, explain: '表示當下決定或承諾的未來動作，用 will。' },
  { type: 'grammar', question: 'The company ____ to hire new staff next month.', options: ['is going', 'will going', 'goes', 'go'], answer: 0, explain: '已排定的計畫用 be going to + 原形動詞。' },
  { type: 'grammar', question: 'You ____ pay by credit card or cash.', options: ['can', 'must', 'should', 'will'], answer: 0, explain: '表示「可以、允許」用 can。' },
  { type: 'grammar', question: '____ you send me the file, please?', options: ['Could', 'Should', 'Must', 'Would like'], answer: 0, explain: 'Could you...? 是客氣的請求句型。' },
  { type: 'grammar', question: 'Employees ____ wear safety helmets in the factory.', options: ['must', 'may', 'could', 'would'], answer: 0, explain: '工廠安全規定屬強制要求，用 must。' },
  { type: 'grammar', question: 'She ____ submit the form by Friday.', options: ['have to', 'has to', 'having to', 'to have'], answer: 1, explain: '主詞 She 是第三人稱單數，用 has to。' },
  { type: 'grammar', question: 'You ____ check the figures again before sending.', options: ['should', 'must not', 'may not', 'could not'], answer: 0, explain: '提出建議用 should。' },
  { type: 'grammar', question: 'Visitors ____ use the parking lot free of charge.', options: ['may', 'must', 'should', 'had better'], answer: 0, explain: '表示允許用 may，多益公告常見。' },
  { type: 'grammar', question: 'She is ____ honest employee.', options: ['a', 'an', 'the', '（不填）'], answer: 1, explain: 'honest 的 h 不發音，實際以母音開頭，用 an。' },
  { type: 'grammar', question: 'He is ____ university graduate.', options: ['a', 'an', 'the', '（不填）'], answer: 0, explain: 'university 發音為 /juː/，屬子音開頭，用 a。' },
  { type: 'grammar', question: 'The trip takes about ____ hour by train.', options: ['a', 'an', 'the', '（不填）'], answer: 1, explain: 'hour 的 h 不發音，用 an。' },
  { type: 'grammar', question: 'Mr. Chen is ____ manager of the Taipei office.', options: ['a', 'an', 'the', '（不填）'], answer: 2, explain: '被 of 片語限定為特定唯一，用定冠詞 the。' },
  { type: 'grammar', question: 'We have three ____ in the storage room.', options: ['box', 'boxs', 'boxes', 'boxies'], answer: 2, explain: '字尾為 x 的名詞複數加 -es。' },
  { type: 'grammar', question: 'The company has branches in five ____.', options: ['citys', 'cities', 'cityes', 'city'], answer: 1, explain: '子音 + y 結尾，去 y 加 ies → cities。' },
  { type: 'grammar', question: 'Three ____ attended the workshop.', options: ['person', 'persons', 'people', 'peoples'], answer: 2, explain: 'person 的常用複數是 people。' },
  { type: 'grammar', question: 'All the ____ has been checked and repaired.', options: ['equipment', 'equipments', 'equipmentes', 'an equipment'], answer: 0, explain: 'equipment 是不可數名詞，不加 -s，動詞用單數。' },
  { type: 'grammar', question: 'The ____ is available on our website.', options: ['information', 'informations', 'an information', 'informationes'], answer: 0, explain: 'information 是不可數名詞。' },
  { type: 'grammar', question: 'You may bring one ____ of luggage on board.', options: ['piece', 'pieces', 'sheet', 'number'], answer: 0, explain: 'luggage 不可數，用 a piece of 計量。' },
  { type: 'grammar', question: 'Would you like ____ coffee before the meeting?', options: ['some', 'any', 'many', 'a few'], answer: 0, explain: '客氣的邀請或請求用 some。' },

    id: 'i7-20', kind: 'single',
    docs: [{ label: 'Article', text: `The Case Against the Annual Performance Review

Few management practices have been criticized as consistently, or retained as stubbornly, as the annual performance review.

The objections are familiar. Feedback delivered once a year is too late to change behavior. Ratings compress varied performance into a single number. Managers, aware that ratings drive pay, inflate them to protect their teams.

Some firms have responded by abolishing ratings entirely in favor of continuous conversations. Early reports were enthusiastic. Later assessments have been more mixed: without a rating, several firms found that pay decisions became less transparent, not more, because the reasoning moved from a documented score to an undocumented judgment.

That finding points to the real problem. The review is doing two jobs at once — developing people and allocating pay — and these pull in opposite directions. A conversation intended to surface weaknesses is unlikely to be candid if the employee knows a number is attached.

The firms that appear most satisfied have separated the two, holding development conversations on one cycle and compensation decisions on another.` }],

    { en: 'It was the deadline that forced us to compromise.', zh: '正是那個期限迫使我們妥協。' },
    { en: 'It was in 2020 that the policy took effect.', zh: '這項政策是在 2020 年生效的。' } ] },

  { title: '主詞與動詞一致（進階）', point: 'neither / either / each + of + 複數名詞視為單數；a number of + 複數名詞接複數動詞，the number of + 複數名詞接單數動詞。', examples: [
    { en: 'Neither of the vendors has met the requirements.', zh: '兩家廠商都未達到要求。' },
    { en: 'The number of complaints has declined sharply.', zh: '客訴數量大幅下降。' } ] },

  { title: '就近一致原則', point: 'either A or B、neither A nor B、not only A but also B 當主詞時，動詞與「最接近的主詞」一致。', examples: [
    { en: 'Neither the manager nor the assistants were informed.', zh: '經理與助理都沒有被通知。' },

  { title: '平行結構', point: 'and / or / not only...but also 連接的成分，詞性與結構必須一致。多益常在列舉句尾留空格。', examples: [
    { en: 'The position requires managing budgets, supervising staff, and preparing reports.', zh: '這個職位需要管理預算、監督員工並製作報告。' },

  { title: '比較結構的平行', point: '比較的兩個對象必須是「同類」：those of、that of 用來避免拿產品比公司之類的錯誤比較。', examples: [

  { title: '連接副詞 therefore / nevertheless / otherwise / whereas', point: 'therefore＝因此；nevertheless＝儘管如此；otherwise＝否則；whereas＝然而（對比）。前面通常用分號或句號。', examples: [
    { en: 'The proposal was well researched; nevertheless, it was rejected.', zh: '提案研究充分，儘管如此仍被否決。' },

  { title: '正式讓步用語 albeit / notwithstanding', point: 'albeit＝雖然（後接形容詞或片語，不接完整子句）；notwithstanding＝儘管（介系詞，接名詞）。', examples: [
    { en: 'Progress was steady, albeit slower than planned.', zh: '進度穩定，雖然比計畫慢。' },
    { en: 'Notwithstanding the delay, the project stayed on budget.', zh: '儘管延誤，專案仍未超支。' } ] },

  { title: 'be to + 原形動詞', point: '表示規定、正式安排或命令，語氣比 must 更正式，常見於公告與合約。', examples: [
    { en: 'All visitors are to register at the front desk.', zh: '所有訪客都必須在櫃檯登記。' },
    { en: 'Payment is to be made within 30 days.', zh: '款項須於 30 天內支付。' } ] },

  { title: 'would rather / had better / may as well', point: '三者後面都接原形動詞。would rather A than B＝寧願；had better＝最好（帶警告）；may as well＝不妨。', examples: [
    { en: 'We would rather delay the launch than release a flawed product.', zh: '我們寧願延後上市也不願推出有瑕疵的產品。' },

  { title: '未來完成式與未來進行式', point: 'will have + p.p.＝到未來某時「將已完成」；will be + V-ing＝未來某時「將正在進行」。', examples: [

  { title: '完成式不定詞與完成式動名詞', point: 'to have + p.p. 表示比主要動詞更早發生；having + p.p. 同理用於動名詞。', examples: [

  { title: '被動不定詞與被動動名詞', point: 'to be + p.p.（被動不定詞）、being + p.p.（被動動名詞），用於動作接受者當主詞時。', examples: [
    { en: 'The contract needs to be signed by both parties.', zh: '合約需要雙方簽署。' },

  { title: '使役與感官動詞的被動還原', point: 'make 的被動要還原成 be made to V；see / hear 的被動同樣還原為 be seen / heard to V。', examples: [

  { title: '雙受詞動詞的被動', point: 'give / send / offer / award 等有兩個受詞，被動時可用任一受詞當主詞。', examples: [

  { title: '情態動詞 + have + p.p.', point: 'must have p.p.（當初一定）、should have p.p.（早該而未做）、could have p.p.（原本可以）、need not have p.p.（其實不必）。', examples: [

  { title: '名詞化與正式文體', point: '學術與商務寫作常把動詞轉為名詞以提高正式度與資訊密度：implement → implementation、analyze → analysis。', examples: [

  { title: '限定詞與量詞的搭配', point: 'a great deal of / a large amount of + 不可數；a large number of / numerous + 可數複數；plenty of 兩者皆可。', examples: [

  { title: '插入語與主詞動詞的距離', point: '主詞與動詞之間插入的關係子句或片語不影響動詞的單複數判斷，多益常用此設陷阱。', examples: [
    { en: 'The report, along with the supporting documents, was submitted.', zh: '報告連同佐證文件一併提交了。' },

  { title: 'used to / be used to / get used to', point: 'used to + 原形＝過去習慣；be used to + V-ing＝習慣於；get used to + V-ing＝逐漸習慣。', examples: [

  { title: '省略與替代 so / do so / one', point: '避免重複時用 do so 代替前面的動詞片語、so 代替 that 子句、one(s) 代替可數名詞。', examples: [

  { title: '正式書信與公告常見句型', point: 'Should you have any questions…、Please be advised that…、We regret to inform you that…、Enclosed please find…。多益 Part 6 高頻。', examples: [
    { en: 'Please be advised that the office will close early on Friday.', zh: '謹此通知，辦公室週五將提早關閉。' },
    { en: 'Should you have any questions, please contact us.', zh: '如有任何問題，請與我們聯絡。' } ] }
];

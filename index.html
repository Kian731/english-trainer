<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>英文學習 English Trainer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo">EN</span>
    <div>
      <h1>英文學習 English Trainer</h1>
      <p class="tagline">目前學習者：<span id="activeName">—</span></p>
    </div>
  </div>
  <button id="btnHome" class="ghost-btn">← 回到等級選擇</button>
</header>

<main>

  <!-- ===== 等級選擇 ===== -->
  <section id="viewHome" class="view">
    <div id="profileArea" class="profile-area"></div>
    <div id="backupBar" class="backup-bar"></div>
    <input type="file" id="importFile" accept="application/json,.json" hidden>

    <div id="levelSection">
      <h2 class="view-title">選擇你的學習等級</h2>
      <div id="levelCards" class="level-cards"></div>
      <div class="hint">學習進度會自動儲存在這台電腦的瀏覽器裡，關閉瀏覽器不會消失。</div>
    </div>
  </section>

  <!-- ===== 學習 / 測驗 ===== -->
  <section id="viewLevel" class="view hidden">
    <div class="level-head">
      <h2 id="levelTitle">基礎</h2>
      <p id="levelDesc" class="level-desc"></p>
    </div>

    <nav class="tabs">
      <button class="tab active" data-tab="words">單字卡</button>
      <button class="tab" data-tab="grammar">語法</button>
      <button class="tab" data-tab="quiz">小測驗</button>
    </nav>

    <!-- 單字卡 -->
    <div id="tabWords" class="tab-panel">
      <div class="card-progress">
        <span id="wordCounter">1 / 10</span>
        <span id="learnedCounter" class="learned-counter"></span>
      </div>
      <div id="flashcard" class="flashcard">
        <div class="flash-inner">
          <div class="flash-face flash-front">
            <div class="word-en" id="fcWord"></div>
            <div class="word-phonetic" id="fcPhonetic"></div>
            <div class="flip-hint">點擊卡片看解答</div>
          </div>
          <div class="flash-face flash-back">
            <div class="word-zh"><span class="pos" id="fcPos"></span><span id="fcZh"></span></div>
            <div class="example" id="fcExample"></div>
            <div class="example-zh" id="fcExampleZh"></div>
          </div>
        </div>
      </div>
      <div class="card-actions">
        <button id="prevWord" class="ghost-btn">← 上一個</button>
        <button id="markLearned" class="primary-btn">標記為已學會</button>
        <button id="nextWord" class="ghost-btn">下一個 →</button>
      </div>
      <ul id="wordList" class="word-list"></ul>
    </div>

    <!-- 語法 -->
    <div id="tabGrammar" class="tab-panel hidden">
      <div class="card-progress"><span>展開文法重點閱讀後，可標記為已讀</span><span id="grammarCounter" class="learned-counter"></span></div>
      <div id="grammarList" class="grammar-list"></div>
    </div>

    <!-- 測驗 -->
    <div id="tabQuiz" class="tab-panel hidden">
      <!-- 開始畫面 -->
      <div id="quizIntro" class="quiz-box">
        <h3>多益模擬測驗</h3>
        <p class="quiz-intro-text">選擇要練習的題型。作答後會立即顯示對錯與中文解析。</p>
        <div id="partPicker" class="part-picker"></div>
        <p class="part-summary">已選範圍共 <strong id="quizCount">0</strong> 題</p>
        <div class="round-size">
          <span class="round-label">每回合題數</span>
          <div class="size-btns">
            <button class="size-btn active" data-size="10">10 題</button>
            <button class="size-btn" data-size="20">20 題</button>
            <button class="size-btn" data-size="0">全部</button>
          </div>
        </div>
        <label class="shuffle-line"><input type="checkbox" id="shuffleToggle" checked> 隨機抽題（關閉則依題庫順序）</label>
        <label class="shuffle-line"><input type="checkbox" id="freshToggle" checked> 優先出還沒答對過的題目</label>
        <p id="quizBest" class="quiz-best"></p>
        <button id="startQuiz" class="primary-btn big">開始測驗</button>
      </div>

      <!-- 作答畫面 -->
      <div id="quizPlay" class="quiz-box hidden">
        <div class="quiz-bar"><div id="quizBarFill" class="quiz-bar-fill"></div></div>
        <div class="quiz-meta">
          <span id="quizProgress">第 1 / 10 題</span>
          <span id="quizScore">答對 0 題</span>
        </div>
        <div id="quizType" class="quiz-type"></div>
        <div id="passageBox" class="passage-box hidden"></div>
        <h3 id="quizQuestion" class="quiz-question"></h3>
        <div id="quizOptions" class="quiz-options"></div>
        <div id="quizFeedback" class="quiz-feedback hidden"></div>
        <button id="nextQuestion" class="primary-btn hidden">下一題 →</button>
      </div>

      <!-- 結果畫面 -->
      <div id="quizResult" class="quiz-box hidden">
        <h3>測驗結果</h3>
        <div class="score-ring"><span id="scoreText">0 / 10</span></div>
        <p id="scoreComment" class="score-comment"></p>
        <div id="wrongReview" class="wrong-review"></div>
        <div class="card-actions">
          <button id="retryQuiz" class="primary-btn">再測一次</button>
          <button id="backToStudy" class="ghost-btn">回去複習單字</button>
        </div>
      </div>
    </div>
  </section>

</main>


<script src="data/basic-words.js"></script>
<script src="data/basic-grammar.js"></script>
<script src="data/basic-quiz.js"></script>
<script src="data/basic-part6.js"></script>
<script src="data/basic-part7.js"></script>
<script src="data/inter-words.js"></script>
<script src="data/inter-grammar.js"></script>
<script src="data/inter-quiz.js"></script>
<script src="data/inter-part6.js"></script>
<script src="data/inter-part7.js"></script>
<script src="data/adv-words.js"></script>
<script src="data/adv-grammar.js"></script>
<script src="data/adv-quiz.js"></script>
<script src="data/adv-part6.js"></script>
<script src="data/adv-part7.js"></script>
<script src="data/part5-zh.js"></script>
<script src="data/part6-zh.js"></script>
<script src="data/part7-zh.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
